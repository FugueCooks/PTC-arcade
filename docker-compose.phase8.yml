services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: retro_arcade
      POSTGRES_USER: retro_arcade
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - phase8-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro_arcade -d retro_arcade"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  phase8-postgres:
