services:
  - type: web
    name: retro-arcade-multiplayer
    runtime: docker
    plan: free
    region: oregon
    branch: main
    # On: this is the host serving ptcarcade.fun, so a merge to main has to
    # reach it. The free plan is what causes the idle spin-down, and the
    # scheduled ping in cloudflare/src/index.ts is what works around it —
    # see docs/deployment-ptcarcade-fun.md for the instance-hour budget that
    # keep-warm consumes.
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: LEGACY_PASSWORD_AUTH_ENABLED
        value: "0"
      - key: WALLET_AUTH_ENABLED
        value: "1"
      - key: GUEST_SESSION_TTL_SECONDS
        value: "3600"
      - key: WALLET_CHALLENGE_TTL_SECONDS
        value: "300"
      - key: WALLET_CHALLENGE_MAX_ATTEMPTS
        value: "5"
      - key: SOLANA_NETWORK
        value: mainnet-beta
      - key: SOLANA_APP_DOMAIN
        value: ptcarcade.fun
      - key: SOLANA_APP_URI
        value: https://ptcarcade.fun
      - key: PUBLIC_APP_ORIGIN
        value: https://ptcarcade.fun
      - key: GAME_ASSET_BASE_URL
        value: https://assets.ptcarcade.fun/arcade/games
      - key: BIOS_ASSET_URL
        value: https://assets.ptcarcade.fun/arcade/bios/SCPH1001.BIN
      - key: GAMECUBE_DSP_ASSET_URL
        value: https://assets.ptcarcade.fun/arcade/bios/dsp_rom.bin
      - key: REALTIME_URL
        value: https://retro-arcade-realtime.roms-retro-arcade.workers.dev/realtime
      # Declared so a Blueprint sync cannot clear what is set in the dashboard.
      # `sync: false` means "this service has a value; leave it alone" — the
      # secrets themselves never belong in a committed file.
      #
      # Without DATABASE_URL every /api/auth route answers 503, and because
      # REALTIME_URL is set above, that includes the realtime ticket the client
      # must hold before entering — so entry fails rather than degrading to a
      # local guest. Both of these are required here, not optional.
      - key: DATABASE_URL
        sync: false
      - key: MULTIPLAYER_TICKET_SECRET
        sync: false
