services:
  - type: web
    name: retro-arcade-multiplayer
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: GAME_ASSET_BASE_URL
        value: https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/games
      - key: BIOS_ASSET_URL
        value: https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/bios/SCPH1001.BIN
      - key: REALTIME_URL
        value: https://retro-arcade-realtime.roms-retro-arcade.workers.dev/realtime
