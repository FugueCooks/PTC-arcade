services:
  - type: web
    name: retro-arcade-multiplayer
    runtime: docker
    plan: free
    region: oregon
    branch: main
    # Off by design. The free plan spins down when idle, which is unusable for a
    # persistent multiplayer socket server, so Render is kept as a spare
    # environment rather than serving ptcarcade.fun.
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: LEGACY_PASSWORD_AUTH_ENABLED
        value: "0"
      - key: WALLET_AUTH_ENABLED
        value: "1"
      - key: GUEST_SESSION_TTL_SECONDS
        value: "3600"
      - key: WALLET_CHALLENGE_TTL_SECONDS
        value: "300"
      - key: WALLET_CHALLENGE_MAX_ATTEMPTS
        value: "5"
      - key: SOLANA_NETWORK
        value: mainnet-beta
      - key: SOLANA_APP_DOMAIN
        value: ptcarcade.fun
      - key: SOLANA_APP_URI
        value: https://ptcarcade.fun
      - key: PUBLIC_APP_ORIGIN
        value: https://ptcarcade.fun
      - key: GAME_ASSET_BASE_URL
        value: https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/games
      - key: BIOS_ASSET_URL
        value: https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/bios/SCPH1001.BIN
      - key: GAMECUBE_DSP_ASSET_URL
        value: https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/bios/dsp_rom.bin
      - key: REALTIME_URL
        value: https://retro-arcade-realtime.roms-retro-arcade.workers.dev/realtime
