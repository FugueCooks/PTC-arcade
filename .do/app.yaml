name: retro-arcade-multiplayer
region: sfo

services:
  - name: arcade
    github:
      repo: FugueCooks/retro-arcade-multiplayer
      branch: main
      # Off: Fly serves ptcarcade.fun and is the only target a merge to main
      # should reach. Leaving this on would build a second copy of the same
      # code on a host that no longer fronts the domain. Note that this file
      # only governs the live app if the spec is applied to it
      # (`doctl apps update --spec .do/app.yaml`); otherwise the setting in the
      # DigitalOcean dashboard is what actually decides.
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    # No custom domain: ptcarcade.fun resolves to Fly. Two hosts holding a
    # certificate for the same apex is how a stale build ends up answering it.
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: PORT
        value: "8080"
        scope: RUN_TIME
        type: GENERAL
      - key: TRUST_PROXY
        value: "1"
        scope: RUN_TIME
        type: GENERAL
      - key: GAME_ASSET_BASE_URL
        value: https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/games
        scope: RUN_TIME
        type: GENERAL
      - key: BIOS_ASSET_URL
        value: https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/bios/SCPH1001.BIN
        scope: RUN_TIME
        type: GENERAL
      - key: GAMECUBE_DSP_ASSET_URL
        value: https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/bios/dsp_rom.bin
        scope: RUN_TIME
        type: GENERAL
      # Domain-dependent, and set for the canonical origin. SOLANA_APP_DOMAIN
      # is what a wallet shows the player when they sign in, so it must match
      # the address bar exactly. On this spare host the address bar is the
      # ondigitalocean.app hostname, so wallet login will warn or fail here
      # while guest play works normally — that is expected for a spare.
      - key: PUBLIC_APP_ORIGIN
        value: https://ptcarcade.fun
        scope: RUN_TIME
        type: GENERAL
      - key: SOLANA_APP_DOMAIN
        value: ptcarcade.fun
        scope: RUN_TIME
        type: GENERAL
      - key: SOLANA_APP_URI
        value: https://ptcarcade.fun
        scope: RUN_TIME
        type: GENERAL
    health_check:
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
      http_path: /healthz
      port: 8080
    liveness_health_check:
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
      http_path: /healthz
      port: 8080
    termination:
      drain_seconds: 30
      grace_period_seconds: 60
