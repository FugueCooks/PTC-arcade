<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play! PS2 Experimental Player</title>
    <link rel="stylesheet" href="./main.css" />
    <style>
      :root { color-scheme: dark; }
      html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#02030a; color:#d9d2e6; }
      body { font-family:"Courier New",monospace; }
      #ps2-shell { width:100%; height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; place-items:center; }
      #ps2-status { width:100%; box-sizing:border-box; padding:.55rem .8rem; color:#36f9f6; background:#080719; border-bottom:1px solid #543386; font-size:.72rem; letter-spacing:.08em; }
      #outputCanvas { width:100%; height:100%; min-height:0; object-fit:contain; background:#000; outline:none; }
      #root { width:100%; box-sizing:border-box; padding:.45rem .8rem; background:#080719; border-top:1px solid #543386; }
      #root input[type="file"] { max-width:100%; color:#fff; }
      #root button, #root input::file-selector-button { padding:.45rem .7rem; color:#36f9f6; background:#100b22; border:1px solid #36f9f6; font:inherit; cursor:pointer; }
      span.version, span.stats { color:#a99abe; font-size:.65rem; }
      body.remote-disc #root { position:absolute; right:.65rem; bottom:.55rem; width:auto; padding:.28rem .5rem; border:1px solid #36f9f655; border-radius:4px; background:#050510c7; pointer-events:none; }
      body.remote-disc #root input, body.remote-disc #root .version { display:none; }
      body.remote-disc #root .stats { float:none; color:#8ffdfa; letter-spacing:.05em; }
    </style>
  </head>
  <body>
    <main id="ps2-shell">
      <div id="ps2-status">PLAY! WEBASSEMBLY // INITIALIZING EXPERIMENTAL PS2 CORE…</div>
      <canvas id="outputCanvas" width="640" height="480" tabindex="0"></canvas>
      <div id="root"></div>
    </main>
    <script>
      const statusElement = document.querySelector('#ps2-status');
      const RANGE_CACHE_DIRECTORY = 'retro-arcade-ps2-ranges-v1';
      const RANGE_CHUNK_BYTES = 4 * 1024 * 1024;
      let pendingFile = null;
      let pendingRemote = null;
      let readySent = false;
      let discFailureReported = false;

      function cacheKey(source) {
        let hash = 2166136261;
        for (const character of `${source.url}|${source.name}|${source.size}`) {
          hash ^= character.charCodeAt(0);
          hash = Math.imul(hash, 16777619);
        }
        const safeName = source.name.toLowerCase().replace(/[^a-z0-9.-]+/g, '-').slice(0, 48) || 'disc';
        return `${safeName}-${source.size}-${(hash >>> 0).toString(16)}`;
      }

      async function rangeCache(source, maxChunks) {
        if (typeof navigator.storage?.getDirectory !== 'function') return null;
        try {
          await navigator.storage.persist?.();
          const root = await navigator.storage.getDirectory();
          const cache = await root.getDirectoryHandle(RANGE_CACHE_DIRECTORY, { create: true });
          const directory = await cache.getDirectoryHandle(cacheKey(source), { create: true });
          const storedIndexes = new Set();
          for await (const name of directory.keys()) {
            const match = /^(\d+)\.chunk$/.exec(name);
            if (match) storedIndexes.add(Number(match[1]));
          }
          return {
            async get(index, expectedBytes) {
              const name = `${index}.chunk`;
              try {
                const handle = await directory.getFileHandle(name);
                const file = await handle.getFile();
                if (file.size === expectedBytes) return file.arrayBuffer();
                await directory.removeEntry(name);
              } catch (error) {
                if (error?.name !== 'NotFoundError') console.warn('Could not read a cached PS2 disc range.', error);
              }
              return null;
            },
            async put(index, buffer) {
              if (!storedIndexes.has(index) && storedIndexes.size >= maxChunks) return false;
              const isNew = !storedIndexes.has(index);
              storedIndexes.add(index);
              const handle = await directory.getFileHandle(`${index}.chunk`, { create: true });
              const writable = await handle.createWritable({ keepExistingData: false });
              try {
                await writable.write(buffer);
                await writable.close();
                return true;
              } catch (error) {
                if (isNew) storedIndexes.delete(index);
                try { await writable.abort(); } catch { /* Already closed. */ }
                throw error;
              }
            }
          };
        } catch (error) {
          console.warn('Persistent PS2 range caching is unavailable.', error);
          return null;
        }
      }

      function reportDiscFailure(error, start, end) {
        if (discFailureReported) return;
        discFailureReported = true;
        const message = error instanceof Error ? error.message : 'Unknown remote disc error.';
        console.error('PS2 remote disc read failed.', { start, end, message });
        statusElement.textContent = `DISC READ FAILED AT ${Math.floor(start / 1024 ** 2)} MB // RETRY THE CABINET OR CACHE THE GAME LOCALLY`;
        parent.postMessage({ type: 'arcade:ps2-disc-error', core: 'ps2-play', message }, location.origin);
      }

      async function fetchRange(url, start, end) {
        let lastError;
        for (let attempt = 1; attempt <= 5; attempt += 1) {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 20000);
          try {
            const response = await fetch(url, {
              headers: { Range: `bytes=${start}-${end - 1}` },
              credentials: 'omit',
              signal: controller.signal
            });
            if (response.status !== 206) throw new Error(`Remote disc range request failed (${response.status}).`);
            const expectedRange = `bytes ${start}-${end - 1}/`;
            const contentRange = response.headers.get('content-range') ?? '';
            if (!contentRange.toLowerCase().startsWith(expectedRange)) throw new Error('Remote disc returned the wrong byte range.');
            const buffer = await response.arrayBuffer();
            if (buffer.byteLength !== end - start) throw new Error('Remote disc returned an incomplete byte range.');
            return buffer;
          } catch (error) {
            lastError = error;
            if (attempt < 5) await new Promise(resolve => setTimeout(resolve, attempt * 400));
          } finally {
            clearTimeout(timeout);
          }
        }
        throw lastError;
      }

      function remoteDisc(source) {
        const chunkSize = RANGE_CHUNK_BYTES;
        const maxCachedChunks = 40;
        const readAheadChunks = navigator.connection?.saveData ? 0 : (navigator.connection?.downlink >= 10 ? 4 : 2);
        const maxPersistentChunks = navigator.deviceMemory && navigator.deviceMemory <= 4 ? 32 : 128;
        const chunks = new Map();
        const persistentCache = rangeCache(source, maxPersistentChunks);
        const persistentWrites = new Set();
        let persistentCacheFailed = false;

        async function loadChunk(index, start, end) {
          const persistent = await persistentCache;
          const cached = await persistent?.get(index, end - start);
          if (cached) return cached;
          const buffer = await fetchRange(source.url, start, end);
          if (persistent && !persistentCacheFailed && !persistentWrites.has(index)) {
            persistentWrites.add(index);
            void persistent.put(index, buffer).catch(error => {
              persistentCacheFailed = true;
              console.warn('Could not persist a PS2 disc range.', error);
            });
          }
          return buffer;
        }

        function cachedChunk(index) {
          const existing = chunks.get(index);
          if (existing) {
            chunks.delete(index);
            chunks.set(index, existing);
            return existing;
          }
          const start = index * chunkSize;
          const end = Math.min(source.size, start + chunkSize);
          const request = loadChunk(index, start, end).catch(error => {
            chunks.delete(index);
            throw error;
          });
          chunks.set(index, request);
          while (chunks.size > maxCachedChunks) chunks.delete(chunks.keys().next().value);
          return request;
        }

        async function read(start, end) {
          if (end <= start) return new ArrayBuffer(0);
          const firstChunk = Math.floor(start / chunkSize);
          const lastChunk = Math.floor((end - 1) / chunkSize);
          const requests = [];
          for (let index = firstChunk; index <= lastChunk; index += 1) requests.push(cachedChunk(index));
          const buffers = await Promise.all(requests);
          // Play! performs many small, nearby disc reads. Warm the next chunks
          // after each demand read so gameplay does not repeatedly wait on CDN
          // round trips, while retaining a strict bounded memory cache.
          for (let offset = 1; offset <= readAheadChunks; offset += 1) {
            const nextChunk = lastChunk + offset;
            if (nextChunk * chunkSize >= source.size) break;
            void cachedChunk(nextChunk).catch(() => {});
          }
          if (buffers.length === 1) {
            const offset = start - firstChunk * chunkSize;
            return buffers[0].slice(offset, offset + (end - start));
          }
          const output = new Uint8Array(end - start);
          let written = 0;
          for (let index = 0; index < buffers.length; index += 1) {
            const chunkIndex = firstChunk + index;
            const chunkStart = chunkIndex * chunkSize;
            const copyStart = Math.max(start, chunkStart);
            const copyEnd = Math.min(end, chunkStart + buffers[index].byteLength);
            const sourceOffset = copyStart - chunkStart;
            const length = copyEnd - copyStart;
            output.set(new Uint8Array(buffers[index], sourceOffset, length), written);
            written += length;
          }
          return output.buffer;
        }

        return Object.freeze({
          name: source.name,
          size: source.size,
          slice(start, end) {
            const numericStart = Number(start);
            const numericEnd = end === undefined ? source.size : Number(end);
            const safeStart = Math.floor(Math.max(0, Math.min(source.size, Number.isFinite(numericStart) ? numericStart : 0)));
            const safeEnd = Math.floor(Math.max(safeStart, Math.min(source.size, Number.isFinite(numericEnd) ? numericEnd : source.size)));
            return {
              arrayBuffer: () => read(safeStart, safeEnd).catch(error => {
                reportDiscFailure(error, safeStart, safeEnd);
                throw error;
              })
            };
          }
        });
      }

      function bootStatus(name, mode) {
        const title = name.toUpperCase();
        if (/KINGDOM[-_ ]HEARTS/.test(title)) return `${mode} ${title} // BLACK INTRO MOVIE? PRESS ENTER ONCE TO SKIP`;
        return `${mode} ${title} // VISITED DISC DATA CACHES AUTOMATICALLY`;
      }

      function loadPendingFile() {
        const input = document.querySelector('input[type="file"]');
        if (!input || !pendingFile) return false;
        const transfer = new DataTransfer();
        transfer.items.add(pendingFile);
        input.files = transfer.files;
        input.dispatchEvent(new Event('change', { bubbles: true }));
        statusElement.textContent = bootStatus(pendingFile.name, 'BOOTING');
        parent.postMessage({ type: 'arcade:ps2-source-accepted', core: 'ps2-play' }, location.origin);
        pendingFile = null;
        document.querySelector('#outputCanvas').focus();
        return true;
      }

      function loadPendingRemote() {
        const input = document.querySelector('input[type="file"]');
        if (!input || !pendingRemote) return false;
        const source = pendingRemote;
        const file = remoteDisc(source);
        document.body.classList.add('remote-disc');
        Object.defineProperty(input, 'files', { configurable: true, value: [file] });
        input.dispatchEvent(new Event('change', { bubbles: true }));
        statusElement.textContent = bootStatus(source.name, 'STREAMING');
        parent.postMessage({ type: 'arcade:ps2-source-accepted', core: 'ps2-play' }, location.origin);
        pendingRemote = null;
        document.querySelector('#outputCanvas').focus();
        return true;
      }

      addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== parent) return;
        if (event.data?.type === 'arcade:ps2-load-file' && event.data.file instanceof File) {
          pendingFile = event.data.file;
          if (!loadPendingFile()) statusElement.textContent = 'PS2 CORE READYING FILE LOADER…';
          return;
        }
        if (event.data?.type === 'arcade:ps2-load-remote') {
          const { url, name, size } = event.data;
          if (typeof url !== 'string' || !url.startsWith('https://') || typeof name !== 'string' || !/\.(iso|chd|cso|isz|bin)$/i.test(name) || !Number.isSafeInteger(size) || size <= 0 || size > 16 * 1024 ** 3) return;
          pendingRemote = { url, name, size };
          if (!loadPendingRemote()) statusElement.textContent = 'PS2 CORE READYING REMOTE DISC…';
        }
      });

      const readyPoll = setInterval(() => {
        const input = document.querySelector('input[type="file"]');
        if (!input) return;
        if (!readySent) {
          readySent = true;
          statusElement.textContent = 'PLAY! PS2 CORE READY // SELECT A LEGALLY DUMPED GAME IMAGE';
          input.addEventListener('change', () => {
            const file = input.files?.[0];
            if (file) statusElement.textContent = bootStatus(file.name, 'BOOTING');
          });
          parent.postMessage({ type: 'arcade:emulator-ready', core: 'ps2-play' }, location.origin);
        }
        loadPendingFile();
        loadPendingRemote();
        clearInterval(readyPoll);
      }, 100);

      addEventListener('error', () => parent.postMessage({ type: 'arcade:emulator-error', core: 'ps2-play' }, location.origin));
      addEventListener('unhandledrejection', () => parent.postMessage({ type: 'arcade:emulator-error', core: 'ps2-play' }, location.origin));
      addEventListener('pagehide', () => parent.postMessage({ type: 'arcade:emulator-closed', core: 'ps2-play' }, location.origin));
    </script>
    <script defer src="./main.js"></script>
  </body>
</html>
