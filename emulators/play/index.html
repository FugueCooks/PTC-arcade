<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play! PS2 Experimental Player</title>
    <link rel="stylesheet" href="./main.css" />
    <style>
      :root { color-scheme: dark; }
      html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#02030a; color:#d9d2e6; }
      body { font-family:"Courier New",monospace; }
      #ps2-shell { width:100%; height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; place-items:center; }
      #ps2-status { width:100%; box-sizing:border-box; padding:.55rem .8rem; color:#36f9f6; background:#080719; border-bottom:1px solid #543386; font-size:.72rem; letter-spacing:.08em; }
      /* The rest of the arcade draws its emulator output pixelated; this frame
         was smoothing a 640x480 buffer up to whatever fractional size the panel
         happened to be. On a moving camera that resamples every pixel slightly
         differently each frame, which reads as the whole image shimmering. The
         size is snapped to a whole multiple below, so a source pixel is always
         the same block of screen pixels. */
      #outputCanvas {
        max-width:100%;
        max-height:100%;
        min-height:0;
        margin:auto;
        background:#000;
        outline:none;
        image-rendering:pixelated;
      }
      #root { width:100%; box-sizing:border-box; padding:.45rem .8rem; background:#080719; border-top:1px solid #543386; }
      #root input[type="file"] { max-width:100%; color:#fff; }
      #root button, #root input::file-selector-button { padding:.45rem .7rem; color:#36f9f6; background:#100b22; border:1px solid #36f9f6; font:inherit; cursor:pointer; }
      span.version, span.stats { color:#a99abe; font-size:.65rem; }
      body.remote-disc #root { position:absolute; right:.65rem; bottom:.55rem; width:auto; padding:.28rem .5rem; border:1px solid #36f9f655; border-radius:4px; background:#050510c7; pointer-events:none; }
      body.remote-disc #root input, body.remote-disc #root .version { display:none; }
      body.remote-disc #root .stats { float:none; color:#8ffdfa; letter-spacing:.05em; }
      #ps2-toolbar {
        position:fixed;
        z-index:31;
        top:.5rem;
        left:50%;
        display:flex;
        gap:.3rem;
        padding:.3rem .4rem;
        background:#080719e8;
        border:1px solid #36f9f655;
        border-radius:.3rem;
        transform:translateX(-50%);
      }
      #ps2-toolbar button {
        min-width:2.6rem;
        padding:.35rem .5rem;
        color:#36f9f6;
        background:transparent;
        border:1px solid #36f9f644;
        border-radius:.2rem;
        font:700 .6rem "Courier New",monospace;
        letter-spacing:.04em;
        cursor:pointer;
      }
      #ps2-toolbar button:hover { color:#071018; background:#36f9f6; }
      #ps2-toolbar button[aria-pressed="true"] { color:#071018; background:#ffb000; border-color:#ffb000; }
      #ps2-controller-menu {
        position:fixed;
        z-index:30;
        top:2.7rem;
        right:.65rem;
        display:grid;
        justify-items:end;
        gap:.4rem;
        font-size:.62rem;
      }
      #ps2-controller-toggle {
        min-width:7.25rem;
        padding:.5rem .7rem;
        color:#36f9f6;
        background:#080719e8;
        border:1px solid #36f9f6;
        border-radius:.25rem;
        font:700 .62rem "Courier New",monospace;
        letter-spacing:.05em;
      }
      #ps2-controller-help {
        width:min(19rem,calc(100vw - 1.3rem));
        padding:.65rem .75rem;
        color:#d9d2e6;
        background:#050510ed;
        border:1px solid #543386;
        box-shadow:0 0 1.3rem #36f9f633;
        line-height:1.55;
      }
      #ps2-controller-help[hidden] { display:none; }
      #ps2-remap { width:min(19rem,calc(100vw - 1.3rem)); max-height:min(26rem,calc(100vh - 12rem)); overflow-y:auto; padding:.55rem .7rem; color:#d9d2e6; background:#050510f2; border:1px solid #543386; box-shadow:0 0 1.3rem #36f9f633; }
      #ps2-remap[hidden] { display:none; }
      #ps2-remap h2 { margin:0 0 .45rem; color:#36f9f6; font-size:.62rem; letter-spacing:.06em; }
      .ps2-remap-row { display:flex; align-items:center; justify-content:space-between; gap:.4rem; padding:.12rem 0; }
      .ps2-remap-row span { color:#a99abe; }
      .ps2-remap-row button { min-width:5.2rem; padding:.2rem .35rem; color:#36f9f6; background:#100b22; border:1px solid #36f9f644; border-radius:.2rem; font:700 .58rem "Courier New",monospace; cursor:pointer; }
      .ps2-remap-row button.is-listening { color:#071018; background:#ffb000; border-color:#ffb000; }
      #ps2-remap-reset { width:100%; margin-top:.45rem; padding:.3rem; color:#ff9db1; background:transparent; border:1px solid #ff9db155; border-radius:.2rem; font:700 .58rem "Courier New",monospace; cursor:pointer; }
      #ps2-controller-status { color:#fff4a8; }
      #ps2-controller-help strong { color:#36f9f6; }
      #ps2-touch-controls { display:none; }
      body.touch-controls #ps2-touch-controls {
        position:fixed;
        inset:0;
        z-index:20;
        display:block;
        pointer-events:none;
        touch-action:none;
        user-select:none;
        -webkit-user-select:none;
        -webkit-touch-callout:none;
      }
      .ps2-touch-button {
        width:clamp(2.45rem,8.5vmin,4rem);
        height:clamp(2.45rem,8.5vmin,4rem);
        display:grid;
        place-items:center;
        padding:0;
        color:#e9ffff;
        background:#071321b8;
        border:1px solid #58fff1aa;
        border-radius:50%;
        box-shadow:0 0 .8rem #00e9ff44,inset 0 0 .8rem #00e9ff1f;
        font:700 clamp(.68rem,2.5vmin,1rem)/1 "Courier New",monospace;
        pointer-events:auto;
        touch-action:none;
      }
      .ps2-touch-button.is-active {
        color:#071018;
        background:#54fff1e8;
        box-shadow:0 0 1.15rem #37fff4cc;
        transform:scale(.94);
      }
      .ps2-touch-shoulders {
        position:absolute;
        top:2.65rem;
        left:50%;
        display:flex;
        gap:.38rem;
        transform:translateX(-50%);
      }
      .ps2-touch-shoulders .ps2-touch-button {
        width:clamp(2.2rem,8vmin,3.5rem);
        height:clamp(1.8rem,6vmin,2.35rem);
        border-radius:.45rem;
      }
      .ps2-touch-movement,
      .ps2-touch-camera,
      .ps2-touch-face {
        position:absolute;
        bottom:max(.75rem,env(safe-area-inset-bottom));
        display:grid;
        grid-template-columns:repeat(3,clamp(2.45rem,8.5vmin,4rem));
        grid-template-rows:repeat(3,clamp(2.45rem,8.5vmin,4rem));
        gap:.18rem;
      }
      .ps2-touch-movement { left:max(.75rem,env(safe-area-inset-left)); }
      .ps2-touch-face { right:max(.75rem,env(safe-area-inset-right)); }
      .ps2-touch-camera {
        left:50%;
        bottom:max(3.75rem,calc(env(safe-area-inset-bottom) + 3.25rem));
        grid-template-columns:repeat(3,clamp(1.65rem,5.5vmin,2.35rem));
        grid-template-rows:repeat(3,clamp(1.65rem,5.5vmin,2.35rem));
        transform:translateX(-50%);
        opacity:.82;
      }
      .ps2-touch-camera .ps2-touch-button {
        width:clamp(1.65rem,5.5vmin,2.35rem);
        height:clamp(1.65rem,5.5vmin,2.35rem);
        font-size:clamp(.5rem,1.7vmin,.7rem);
      }
      .ps2-touch-label {
        align-self:center;
        color:#8ffdfa;
        font-size:clamp(.42rem,1.5vmin,.58rem);
        text-align:center;
        text-shadow:0 0 .4rem #00ffff;
      }
      .ps2-touch-system {
        position:absolute;
        left:50%;
        bottom:max(.55rem,env(safe-area-inset-bottom));
        display:flex;
        gap:.45rem;
        transform:translateX(-50%);
      }
      .ps2-touch-system .ps2-touch-button {
        width:auto;
        min-width:3.25rem;
        height:1.85rem;
        padding:0 .65rem;
        border-radius:1rem;
        font-size:.58rem;
      }
      .ps2-grid-up { grid-column:2; grid-row:1; }
      .ps2-grid-left { grid-column:1; grid-row:2; }
      .ps2-grid-center { grid-column:2; grid-row:2; }
      .ps2-grid-right { grid-column:3; grid-row:2; }
      .ps2-grid-down { grid-column:2; grid-row:3; }
      .ps2-face-triangle { grid-column:2; grid-row:1; color:#67ff9c; }
      .ps2-face-square { grid-column:1; grid-row:2; color:#ff82e8; }
      .ps2-face-circle { grid-column:3; grid-row:2; color:#ff7b87; }
      .ps2-face-cross { grid-column:2; grid-row:3; color:#70b7ff; }
      @media (max-width:700px) and (orientation:portrait) {
        .ps2-touch-camera { display:none; }
        .ps2-touch-shoulders { top:2.35rem; }
      }
      @media (prefers-reduced-motion:reduce) {
        .ps2-touch-button { transition:none; }
      }
    </style>
  </head>
  <body>
    <main id="ps2-shell">
      <div id="ps2-status">PLAY! WEBASSEMBLY // INITIALIZING EXPERIMENTAL PS2 CORE…</div>
      <canvas id="outputCanvas" width="640" height="480" tabindex="0"></canvas>
      <div id="root"></div>
      <nav id="ps2-toolbar" aria-label="Emulator controls">
        <button id="ps2-mute" type="button" aria-pressed="false" title="Mute and unmute">SOUND</button>
        <button id="ps2-fullscreen" type="button" title="Fullscreen">FULL</button>
        <button id="ps2-restart" type="button" title="Restart this disc">RESET</button>
        <button id="ps2-exit" type="button" title="Leave the cabinet">EXIT</button>
      </nav>
      <aside id="ps2-controller-menu">
        <button id="ps2-controller-toggle" type="button" aria-expanded="false">CONTROLS</button>
        <div id="ps2-controller-help" hidden>
          <div id="ps2-controller-status">CONTROLLER: CONNECT OR PRESS A BUTTON</div>
          <div><strong>LEFT STICK / D-PAD</strong> MOVE</div>
          <div><strong>RIGHT STICK</strong> CAMERA</div>
          <div><strong>A / B / X / Y</strong> × / ○ / □ / △</div>
          <div><strong>LB / LT / RB / RT</strong> L1 / L2 / R1 / R2</div>
          <div><strong>MENU / VIEW</strong> START / SELECT</div>
          <button id="ps2-remap-open" type="button" style="margin-top:.5rem;width:100%;padding:.3rem;color:#36f9f6;background:#100b22;border:1px solid #36f9f6;border-radius:.2rem;font:700 .58rem 'Courier New',monospace;cursor:pointer;">REMAP BUTTONS</button>
        </div>
        <div id="ps2-remap" hidden>
          <h2>PRESS A BUTTON TO BIND IT</h2>
          <div id="ps2-remap-rows"></div>
          <button id="ps2-remap-reset" type="button">RESTORE DEFAULTS</button>
        </div>
      </aside>
      <section id="ps2-touch-controls" aria-label="PlayStation 2 touch controller">
        <div class="ps2-touch-shoulders">
          <button class="ps2-touch-button" data-ps2-keys="Key1" aria-label="L1">L1</button>
          <button class="ps2-touch-button" data-ps2-keys="Key2" aria-label="L2">L2</button>
          <button class="ps2-touch-button" data-ps2-keys="Key9" aria-label="R2">R2</button>
          <button class="ps2-touch-button" data-ps2-keys="Key8" aria-label="R1">R1</button>
        </div>
        <div class="ps2-touch-movement" aria-label="Movement and directional pad">
          <button class="ps2-touch-button ps2-grid-up" data-ps2-keys="KeyT ArrowUp" aria-label="Move up">▲</button>
          <button class="ps2-touch-button ps2-grid-left" data-ps2-keys="KeyF ArrowLeft" aria-label="Move left">◀</button>
          <span class="ps2-touch-label ps2-grid-center">MOVE</span>
          <button class="ps2-touch-button ps2-grid-right" data-ps2-keys="KeyH ArrowRight" aria-label="Move right">▶</button>
          <button class="ps2-touch-button ps2-grid-down" data-ps2-keys="KeyG ArrowDown" aria-label="Move down">▼</button>
        </div>
        <div class="ps2-touch-camera" aria-label="Camera stick">
          <button class="ps2-touch-button ps2-grid-up" data-ps2-keys="KeyI" aria-label="Camera up">▲</button>
          <button class="ps2-touch-button ps2-grid-left" data-ps2-keys="KeyJ" aria-label="Camera left">◀</button>
          <span class="ps2-touch-label ps2-grid-center">CAM</span>
          <button class="ps2-touch-button ps2-grid-right" data-ps2-keys="KeyL" aria-label="Camera right">▶</button>
          <button class="ps2-touch-button ps2-grid-down" data-ps2-keys="KeyK" aria-label="Camera down">▼</button>
        </div>
        <div class="ps2-touch-face" aria-label="Action buttons">
          <button class="ps2-touch-button ps2-face-triangle" data-ps2-keys="KeyS" aria-label="Triangle">△</button>
          <button class="ps2-touch-button ps2-face-square" data-ps2-keys="KeyA" aria-label="Square">□</button>
          <button class="ps2-touch-button ps2-face-circle" data-ps2-keys="KeyX" aria-label="Circle">○</button>
          <button class="ps2-touch-button ps2-face-cross" data-ps2-keys="KeyZ" aria-label="Cross">×</button>
        </div>
        <div class="ps2-touch-system">
          <button class="ps2-touch-button" data-ps2-keys="Backspace" aria-label="Select">SELECT</button>
          <button class="ps2-touch-button" data-ps2-keys="Enter" aria-label="Start">START</button>
        </div>
      </section>
    </main>
    <script type="module">
      import { GAMEPAD_AXES, GAMEPAD_BUTTONS, DEFAULT_DEAD_ZONE, buttonPressed, pickGamepad } from '../gamepad-mapping.js?v=perf-notes-1';
      import { RANGE_CHUNK_BYTES, bootChunkRecorder, fetchDiscRange, openDiscRangeCache } from '../disc-range-cache.js?v=perf-notes-1';

      const statusElement = document.querySelector('#ps2-status');
      let pendingFile = null;
      let pendingRemote = null;
      let readySent = false;
      let discFailureReported = false;

      const PS2_KEYS = Object.freeze({
        ArrowLeft: { key: 'ArrowLeft', keyCode: 37 },
        ArrowUp: { key: 'ArrowUp', keyCode: 38 },
        ArrowRight: { key: 'ArrowRight', keyCode: 39 },
        ArrowDown: { key: 'ArrowDown', keyCode: 40 },
        Backspace: { key: 'Backspace', keyCode: 8 },
        Enter: { key: 'Enter', keyCode: 13 },
        Key1: { key: '1', keyCode: 49 },
        Key2: { key: '2', keyCode: 50 },
        Key8: { key: '8', keyCode: 56 },
        Key9: { key: '9', keyCode: 57 },
        KeyA: { key: 'a', keyCode: 65 },
        KeyF: { key: 'f', keyCode: 70 },
        KeyG: { key: 'g', keyCode: 71 },
        KeyH: { key: 'h', keyCode: 72 },
        KeyI: { key: 'i', keyCode: 73 },
        KeyJ: { key: 'j', keyCode: 74 },
        KeyK: { key: 'k', keyCode: 75 },
        KeyL: { key: 'l', keyCode: 76 },
        KeyS: { key: 's', keyCode: 83 },
        KeyT: { key: 't', keyCode: 84 },
        KeyX: { key: 'x', keyCode: 88 },
        KeyZ: { key: 'z', keyCode: 90 }
      });
      const activeTouchKeys = new Map();
      // Play! keeps its Emscripten module in its own scope: there is no pause,
      // no reset and no save state to call. What can be reached is what the
      // core is built on — the audio contexts it creates and the animation
      // frames it is driven by — so both are captured here, before it starts.
      const audioContexts = [];
      for (const name of ['AudioContext', 'webkitAudioContext']) {
        const Original = window[name];
        if (typeof Original !== 'function') continue;
        const Wrapped = function (...args) {
          const context = new Original(...args);
          audioContexts.push(context);
          return context;
        };
        Wrapped.prototype = Original.prototype;
        window[name] = Wrapped;
      }
      const bootChunks = bootChunkRecorder();
      const BOOT_RECORD_MS = 45000;
      // Leave the browser room to breathe rather than filling its quota, wait
      // this long after a read the core wanted before taking one for the
      // install, and pause between chunks so the connection is mostly the
      // game's.
      const INSTALL_HEADROOM_BYTES = 512 * 1024 * 1024;
      const INSTALL_QUIET_MS = 2500;
      const INSTALL_PAUSE_MS = 400;
      const activeGamepadKeys = new Set();
      const CONTROLLER_IDLE_STATUS = 'CONTROLLER: CONNECT OR PRESS A BUTTON';
      const GAMEPAD_BINDING_STORAGE = 'ps2-gamepad-bindings-v1';
      // What each PS2 control is called, in the order the panel lists them. The
      // key code is the core's own: everything here ends up as one of the keys
      // Play! already listens for, so remapping never reaches the core.
      const PS2_CONTROL_LABELS = Object.freeze({
        KeyZ: 'CROSS', KeyX: 'CIRCLE', KeyA: 'SQUARE', KeyS: 'TRIANGLE',
        Key1: 'L1', Key2: 'L2', Key8: 'R1', Key9: 'R2',
        Backspace: 'SELECT', Enter: 'START',
        ArrowUp: 'D-PAD UP', ArrowDown: 'D-PAD DOWN', ArrowLeft: 'D-PAD LEFT', ArrowRight: 'D-PAD RIGHT'
      });
      const DEFAULT_GAMEPAD_KEY_BINDINGS = Object.freeze([
        { code: 'KeyZ', button: GAMEPAD_BUTTONS.SOUTH },
        { code: 'KeyX', button: GAMEPAD_BUTTONS.EAST },
        { code: 'KeyA', button: GAMEPAD_BUTTONS.WEST },
        { code: 'KeyS', button: GAMEPAD_BUTTONS.NORTH },
        { code: 'Key1', button: GAMEPAD_BUTTONS.L1 },
        { code: 'Key8', button: GAMEPAD_BUTTONS.R1 },
        { code: 'Key2', button: GAMEPAD_BUTTONS.L2 },
        { code: 'Key9', button: GAMEPAD_BUTTONS.R2 },
        { code: 'Backspace', button: GAMEPAD_BUTTONS.SELECT },
        { code: 'Enter', button: GAMEPAD_BUTTONS.START },
        { code: 'ArrowUp', button: GAMEPAD_BUTTONS.DPAD_UP },
        { code: 'ArrowDown', button: GAMEPAD_BUTTONS.DPAD_DOWN },
        { code: 'ArrowLeft', button: GAMEPAD_BUTTONS.DPAD_LEFT },
        { code: 'ArrowRight', button: GAMEPAD_BUTTONS.DPAD_RIGHT }
      ]);
      /**
       * The bindings in force. A saved layout is merged over the defaults by
       * control rather than replacing the list, so a binding added to the core
       * later still appears for a player who customised theirs before it
       * existed, and a stored entry naming a control that no longer exists is
       * dropped instead of breaking the pad.
       */
      function loadGamepadBindings() {
        const bindings = DEFAULT_GAMEPAD_KEY_BINDINGS.map(binding => ({ ...binding }));
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(GAMEPAD_BINDING_STORAGE) ?? 'null'); }
        catch (error) { console.warn('Saved controller layout could not be read.', error); }
        if (saved && typeof saved === 'object') {
          for (const binding of bindings) {
            const button = saved[binding.code];
            if (Number.isSafeInteger(button) && button >= 0 && button < 32) binding.button = button;
          }
        }
        return bindings;
      }
      function saveGamepadBindings(bindings) {
        try {
          localStorage.setItem(GAMEPAD_BINDING_STORAGE, JSON.stringify(Object.fromEntries(bindings.map(b => [b.code, b.button]))));
        } catch (error) {
          console.warn('Controller layout could not be saved.', error);
        }
      }
      let GAMEPAD_KEY_BINDINGS = loadGamepadBindings();
      const GAMEPAD_AXIS_BINDINGS = Object.freeze([
        { negative: 'KeyF', positive: 'KeyH', axis: GAMEPAD_AXES.LEFT_X },
        { negative: 'KeyT', positive: 'KeyG', axis: GAMEPAD_AXES.LEFT_Y },
        { negative: 'KeyJ', positive: 'KeyL', axis: GAMEPAD_AXES.RIGHT_X },
        { negative: 'KeyI', positive: 'KeyK', axis: GAMEPAD_AXES.RIGHT_Y }
      ]);

      function dispatchPs2Key(code, pressed) {
        const definition = PS2_KEYS[code];
        if (!definition) return;
        const canvas = document.querySelector('#outputCanvas');
        const event = new KeyboardEvent(pressed ? 'keydown' : 'keyup', {
          key: definition.key,
          code,
          bubbles: true,
          cancelable: true
        });
        // Play!'s Emscripten input bridge reads legacy numeric fields as well
        // as key/code. Browser-created KeyboardEvents leave those fields at 0.
        Object.defineProperty(event, 'keyCode', { get: () => definition.keyCode });
        Object.defineProperty(event, 'which', { get: () => definition.keyCode });
        canvas.dispatchEvent(event);
      }

      function setGamepadKey(code, pressed) {
        if (code === null) return;
        const active = activeGamepadKeys.has(code);
        if (pressed === active) return;
        if (pressed) activeGamepadKeys.add(code);
        else activeGamepadKeys.delete(code);
        dispatchPs2Key(code, pressed);
      }

      function releaseGamepadKeys() {
        for (const code of [...activeGamepadKeys]) setGamepadKey(code, false);
      }

      function setControllerStatus(text) {
        if (controllerStatusElement.textContent !== text) controllerStatusElement.textContent = text;
      }

      /**
       * Runs only while a pad is connected. This shares a frame budget with a
       * PS2 core, so the poll holds its element references, writes the status
       * line only when it changes, and stops altogether rather than spinning an
       * animation frame forever on a machine that has no controller at all.
       */
      function pollPs2Gamepad() {
        gamepadPollHandle = null;
        const gamepad = pickGamepad(navigator.getGamepads?.(), activeGamepadIndex);
        if (!gamepad) {
          activeGamepadIndex = null;
          releaseGamepadKeys();
          setControllerStatus(CONTROLLER_IDLE_STATUS);
          return;
        }
        activeGamepadIndex = gamepad.index;
        setControllerStatus(`CONTROLLER: ${gamepad.id || 'STANDARD GAMEPAD'} READY`);
        if (listeningFor) {
          // Nothing reaches the game while a control is being bound, or the
          // press that chooses Cross is also a press of Cross.
          releaseGamepadKeys();
          for (let index = 0; index < (gamepad.buttons?.length ?? 0); index += 1) {
            if (!buttonPressed(gamepad, index)) continue;
            bindControl(listeningFor, index);
            break;
          }
          scheduleGamepadPoll();
          return;
        }
        for (const binding of GAMEPAD_KEY_BINDINGS) setGamepadKey(binding.code, binding.button >= 0 && buttonPressed(gamepad, binding.button));
        for (const binding of GAMEPAD_AXIS_BINDINGS) {
          const value = gamepad.axes?.[binding.axis] ?? 0;
          setGamepadKey(binding.negative, value < -DEFAULT_DEAD_ZONE);
          setGamepadKey(binding.positive, value > DEFAULT_DEAD_ZONE);
        }
        if (activeGamepadKeys.size) outputCanvas.focus({ preventScroll: true });
        scheduleGamepadPoll();
      }

      function scheduleGamepadPoll() {
        if (gamepadPollHandle === null) gamepadPollHandle = requestAnimationFrame(pollPs2Gamepad);
      }

      const toolbar = {
        mute: document.querySelector('#ps2-mute'),
        fullscreen: document.querySelector('#ps2-fullscreen'),
        restart: document.querySelector('#ps2-restart'),
        exit: document.querySelector('#ps2-exit')
      };
      toolbar.mute.addEventListener('click', () => {
        const muted = toolbar.mute.getAttribute('aria-pressed') !== 'true';
        toolbar.mute.setAttribute('aria-pressed', String(muted));
        toolbar.mute.textContent = muted ? 'MUTED' : 'SOUND';
        // Suspending the context is the whole of it: the core owns the graph
        // between its source and the speakers, so there is no gain to turn.
        for (const context of audioContexts) {
          if (muted) void context.suspend?.();
          else void context.resume?.();
        }
      });
      toolbar.fullscreen.addEventListener('click', () => {
        const shell = document.querySelector('#ps2-shell');
        if (document.fullscreenElement) void document.exitFullscreen?.();
        else void shell?.requestFullscreen?.().catch(error => console.warn('Fullscreen was refused.', error));
      });
      // No reset entry point either, so the disc is loaded again from the top.
      // The ranges it reads are on disk by now, so this is quick.
      toolbar.restart.addEventListener('click', () => location.reload());
      toolbar.exit.addEventListener('click', () => parent.postMessage({ type: 'arcade:emulator-closed', core: 'ps2-play' }, location.origin));

      const remapPanel = document.querySelector('#ps2-remap');
      const remapRows = document.querySelector('#ps2-remap-rows');
      let listeningFor = null;

      const buttonName = index => {
        const named = Object.entries(GAMEPAD_BUTTONS).find(([, value]) => value === index);
        return named ? named[0].replace(/_/g, ' ') : `BUTTON ${index}`;
      };

      function renderRemapRows() {
        remapRows.textContent = '';
        for (const binding of GAMEPAD_KEY_BINDINGS) {
          const label = PS2_CONTROL_LABELS[binding.code];
          if (!label) continue;
          const row = document.createElement('div');
          row.className = 'ps2-remap-row';
          const name = document.createElement('span');
          name.textContent = label;
          const choose = document.createElement('button');
          choose.type = 'button';
          choose.textContent = listeningFor === binding.code ? 'PRESS…' : buttonName(binding.button);
          if (listeningFor === binding.code) choose.classList.add('is-listening');
          choose.addEventListener('click', () => {
            listeningFor = listeningFor === binding.code ? null : binding.code;
            renderRemapRows();
            scheduleGamepadPoll();
          });
          row.append(name, choose);
          remapRows.append(row);
        }
      }

      function bindControl(code, button) {
        // One physical button drives one control: whatever held it before gives
        // it up, rather than leaving two controls firing from one press.
        for (const binding of GAMEPAD_KEY_BINDINGS) {
          if (binding.button === button && binding.code !== code) binding.button = -1;
          if (binding.code === code) binding.button = button;
        }
        listeningFor = null;
        saveGamepadBindings(GAMEPAD_KEY_BINDINGS);
        renderRemapRows();
      }

      document.querySelector('#ps2-remap-open').addEventListener('click', () => {
        remapPanel.hidden = !remapPanel.hidden;
        listeningFor = null;
        if (!remapPanel.hidden) { renderRemapRows(); scheduleGamepadPoll(); }
      });
      document.querySelector('#ps2-remap-reset').addEventListener('click', () => {
        GAMEPAD_KEY_BINDINGS = DEFAULT_GAMEPAD_KEY_BINDINGS.map(binding => ({ ...binding }));
        listeningFor = null;
        saveGamepadBindings(GAMEPAD_KEY_BINDINGS);
        renderRemapRows();
      });
      renderRemapRows();

      const controllerToggle = document.querySelector('#ps2-controller-toggle');
      const controllerHelp = document.querySelector('#ps2-controller-help');
      const controllerStatusElement = document.querySelector('#ps2-controller-status');
      const outputCanvas = document.querySelector('#outputCanvas');
      /**
       * Presents the core's output at a whole-number scale.
       *
       * Letting the canvas stretch to the panel put 640 buffer pixels across,
       * say, 672.5 screen pixels: a fractional ratio, so each frame lands on a
       * slightly different pixel grid and the picture crawls even while the
       * emulator holds 55 f/s. Snapping to the largest integer multiple that
       * fits keeps every source pixel on the same screen pixels frame after
       * frame. Below one whole multiple there is nothing to snap to, so it
       * falls back to fitting the box.
       */
      function presentAtWholeScale() {
        const stage = outputCanvas.parentElement;
        if (!stage) return;
        const box = stage.getBoundingClientRect();
        const width = outputCanvas.width || 640, height = outputCanvas.height || 480;
        if (!box.width || !box.height || !width || !height) return;
        const fitted = Math.min(box.width / width, box.height / height);
        // Snap to a whole multiple only when that costs almost nothing. A panel
        // that fits 1.9 times would drop to 1 and show the game at half the
        // size it could be, which is a worse trade than the scaling it avoids.
        const whole = Math.floor(fitted);
        const scale = whole >= 1 && whole / fitted >= .85 ? whole : fitted;
        outputCanvas.style.width = `${Math.round(width * scale)}px`;
        outputCanvas.style.height = `${Math.round(height * scale)}px`;
      }
      // The core changes the buffer when a game switches video mode, and the
      // panel changes when the window does, so both are watched.
      new ResizeObserver(presentAtWholeScale).observe(outputCanvas.parentElement ?? document.body);
      new MutationObserver(presentAtWholeScale).observe(outputCanvas, { attributes: true, attributeFilter: ['width', 'height'] });
      addEventListener('resize', presentAtWholeScale);
      presentAtWholeScale();
      let gamepadPollHandle = null;
      let activeGamepadIndex = null;
      controllerToggle.addEventListener('click', () => {
        const open = controllerHelp.hidden;
        controllerHelp.hidden = !open;
        controllerToggle.setAttribute('aria-expanded', String(open));
      });
      addEventListener('gamepadconnected', event => {
        activeGamepadIndex = event.gamepad.index;
        setControllerStatus(`CONTROLLER: ${event.gamepad.id || 'STANDARD GAMEPAD'} READY`);
        controllerHelp.hidden = false;
        controllerToggle.setAttribute('aria-expanded', 'true');
        outputCanvas.focus({ preventScroll: true });
        scheduleGamepadPoll();
      });
      addEventListener('gamepaddisconnected', () => {
        releaseGamepadKeys();
        setControllerStatus(CONTROLLER_IDLE_STATUS);
      });
      // A pad connected before this frame loaded only surfaces once the page
      // has seen it, so take one look now and then wait for the connect event.
      scheduleGamepadPoll();

      function releaseTouchPointer(pointerId) {
        const active = activeTouchKeys.get(pointerId);
        if (!active) return;
        activeTouchKeys.delete(pointerId);
        for (const code of active.codes) dispatchPs2Key(code, false);
        active.button.classList.remove('is-active');
      }

      function initializeTouchControls() {
        const hasTouch = navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches;
        if (!hasTouch) return;
        document.body.classList.add('touch-controls');
        const canvas = document.querySelector('#outputCanvas');
        for (const button of document.querySelectorAll('[data-ps2-keys]')) {
          button.addEventListener('pointerdown', event => {
            if (activeTouchKeys.has(event.pointerId)) return;
            event.preventDefault();
            canvas.focus({ preventScroll: true });
            const codes = button.dataset.ps2Keys.split(/\s+/).filter(Boolean);
            activeTouchKeys.set(event.pointerId, { button, codes });
            button.classList.add('is-active');
            button.setPointerCapture?.(event.pointerId);
            for (const code of codes) dispatchPs2Key(code, true);
          });
          for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
            button.addEventListener(type, event => {
              event.preventDefault();
              releaseTouchPointer(event.pointerId);
            });
          }
          button.addEventListener('contextmenu', event => event.preventDefault());
        }
        addEventListener('blur', () => {
          for (const pointerId of [...activeTouchKeys.keys()]) releaseTouchPointer(pointerId);
          releaseGamepadKeys();
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) for (const pointerId of [...activeTouchKeys.keys()]) releaseTouchPointer(pointerId);
        });
      }

      initializeTouchControls();

      function reportDiscFailure(error, start, end) {
        if (discFailureReported) return;
        discFailureReported = true;
        const message = error instanceof Error ? error.message : 'Unknown remote disc error.';
        console.error('PS2 remote disc read failed.', { start, end, message });
        statusElement.textContent = `DISC READ FAILED AT ${Math.floor(start / 1024 ** 2)} MB // RETRY THE CABINET OR CACHE THE GAME LOCALLY`;
        parent.postMessage({ type: 'arcade:ps2-disc-error', core: 'ps2-play', message }, location.origin);
      }

      function remoteDisc(source) {
        const chunkSize = RANGE_CHUNK_BYTES;
        const maxCachedChunks = 40;
        const readAheadChunks = navigator.connection?.saveData ? 0 : (navigator.connection?.downlink >= 10 ? 4 : 2);
        const totalChunks = Math.ceil(source.size / chunkSize);
        // Room for the whole disc where the install can run, because a store
        // capped below the disc would evict the front of the game to hold the
        // end of it and never finish.
        const maxPersistentChunks = navigator.deviceMemory && navigator.deviceMemory <= 4 ? 32 : Math.max(128, totalChunks);
        const chunks = new Map();
        const persistentCache = openDiscRangeCache(source, maxPersistentChunks);
        const persistentWrites = new Set();
        let persistentCacheFailed = false;
        // When the core last had to wait on a read. The installer stays out of
        // the way while that is recent: a background fetch that delays a demand
        // read has made the game worse to play in order to make it faster later.
        let lastDemandRead = 0;
        // The installer's current fetch, so a read the core is waiting on can
        // cancel it outright. Backing off only *after* a demand read starts is
        // too late: on a 4.5 MB/s line a speculative 4 MB chunk is most of a
        // second, and the read the player is waiting on queues behind it.
        let installFetch = null;

        async function loadChunk(index, start, end) {
          const persistent = await persistentCache;
          const cached = await persistent?.get(index, end - start);
          if (cached) return cached;
          // Only a read that reaches the network is pressure worth yielding
          // to. Counting cache hits as well meant the installer stood aside for
          // the whole of a session: during play almost every read is a hit, and
          // it never saw a quiet moment to take a chunk in.
          lastDemandRead = performance.now();
          installFetch?.abort();
          const buffer = await fetchDiscRange(source.url, start, end, { priority: 'high' });
          if (persistent && !persistentCacheFailed && !persistentWrites.has(index)) {
            persistentWrites.add(index);
            void persistent.put(index, buffer).catch(error => {
              persistentCacheFailed = true;
              console.warn('Could not persist a PS2 disc range.', error);
            });
          }
          return buffer;
        }

        function cachedChunk(index) {
          bootChunks.record(index);
          const existing = chunks.get(index);
          if (existing) {
            chunks.delete(index);
            chunks.set(index, existing);
            return existing;
          }
          const start = index * chunkSize;
          const end = Math.min(source.size, start + chunkSize);
          const request = loadChunk(index, start, end).catch(error => {
            chunks.delete(index);
            throw error;
          });
          chunks.set(index, request);
          while (chunks.size > maxCachedChunks) chunks.delete(chunks.keys().next().value);
          return request;
        }

        async function read(start, end) {
          if (end <= start) return new ArrayBuffer(0);
          const firstChunk = Math.floor(start / chunkSize);
          const lastChunk = Math.floor((end - 1) / chunkSize);
          const requests = [];
          for (let index = firstChunk; index <= lastChunk; index += 1) requests.push(cachedChunk(index));
          const buffers = await Promise.all(requests);
          // Play! performs many small, nearby disc reads. Warm the next chunks
          // after each demand read so gameplay does not repeatedly wait on CDN
          // round trips, while retaining a strict bounded memory cache.
          for (let offset = 1; offset <= readAheadChunks; offset += 1) {
            const nextChunk = lastChunk + offset;
            if (nextChunk * chunkSize >= source.size) break;
            void cachedChunk(nextChunk).catch(() => {});
          }
          if (buffers.length === 1) {
            const offset = start - firstChunk * chunkSize;
            return buffers[0].slice(offset, offset + (end - start));
          }
          const output = new Uint8Array(end - start);
          let written = 0;
          for (let index = 0; index < buffers.length; index += 1) {
            const chunkIndex = firstChunk + index;
            const chunkStart = chunkIndex * chunkSize;
            const copyStart = Math.max(start, chunkStart);
            const copyEnd = Math.min(end, chunkStart + buffers[index].byteLength);
            const sourceOffset = copyStart - chunkStart;
            const length = copyEnd - copyStart;
            output.set(new Uint8Array(buffers[index], sourceOffset, length), written);
            written += length;
          }
          return output.buffer;
        }

        /**
         * Pulls the rest of the disc down while the game is being played, so a
         * session that starts by streaming ends with the game on disk and every
         * later read local. This is the difference between fast and instant: a
         * demand read that misses costs the player a visible stall, and the only
         * way to never miss is to already have it.
         *
         * Deliberately unhurried. It yields to the core's own reads, walks the
         * disc in order, and stops the moment storage says no.
         */
        async function installDisc() {
          if (navigator.connection?.saveData) return;
          const persistent = await persistentCache;
          if (!persistent) return;
          const estimate = await navigator.storage?.estimate?.().catch(() => null);
          if (estimate && Number.isFinite(estimate.quota) && Number.isFinite(estimate.usage)
            && estimate.quota - estimate.usage < source.size + INSTALL_HEADROOM_BYTES) {
            console.info('Not enough room to keep this disc locally; it will keep streaming.');
            return;
          }
          let installed = 0, missing = 0;
          for (let index = 0; index < totalChunks; index += 1) {
            if (persistentCacheFailed) return;
            if (persistent.has(index)) continue;
            missing += 1;
            // Wait out any read the core is waiting on, then take one chunk.
            while (performance.now() - lastDemandRead < INSTALL_QUIET_MS) {
              await new Promise(resolve => setTimeout(resolve, INSTALL_QUIET_MS));
            }
            const start = index * chunkSize, end = Math.min(source.size, start + chunkSize);
            const controller = new AbortController();
            installFetch = controller;
            try {
              await persistent.put(index, await fetchDiscRange(source.url, start, end, { attempts: 2, signal: controller.signal, priority: 'low' }));
              installed += 1;
            } catch (error) {
              // Cancelled to get out of the core's way: that chunk simply waits
              // for the next quiet moment rather than ending the install.
              if (controller.signal.aborted) { index -= 1; continue; }
              console.warn('Stopped filling the local copy of this disc.', error);
              return;
            } finally {
              if (installFetch === controller) installFetch = null;
            }
            await new Promise(resolve => setTimeout(resolve, INSTALL_PAUSE_MS));
          }
          if (installed) console.info(`${source.name} is now held locally (${installed} of ${missing} remaining ranges fetched).`);
          parent.postMessage({ type: 'arcade:ps2-disc-installed', core: 'ps2-play', name: source.name }, location.origin);
        }
        void installDisc().catch(error => console.warn('The local copy of this disc could not be completed.', error));

        return Object.freeze({
          name: source.name,
          size: source.size,
          slice(start, end) {
            const numericStart = Number(start);
            const numericEnd = end === undefined ? source.size : Number(end);
            const safeStart = Math.floor(Math.max(0, Math.min(source.size, Number.isFinite(numericStart) ? numericStart : 0)));
            const safeEnd = Math.floor(Math.max(safeStart, Math.min(source.size, Number.isFinite(numericEnd) ? numericEnd : source.size)));
            return {
              arrayBuffer: () => read(safeStart, safeEnd).catch(error => {
                reportDiscFailure(error, safeStart, safeEnd);
                throw error;
              })
            };
          }
        });
      }

      function bootStatus(name, mode) {
        const title = name.toUpperCase();
        if (/KINGDOM[-_ ]HEARTS/.test(title)) return `${mode} ${title} // BLACK INTRO MOVIE? PRESS ENTER ONCE TO SKIP`;
        return `${mode} ${title} // VISITED DISC DATA CACHES AUTOMATICALLY`;
      }

      function loadPendingFile() {
        const input = document.querySelector('input[type="file"]');
        if (!input || !pendingFile) return false;
        const transfer = new DataTransfer();
        transfer.items.add(pendingFile);
        input.files = transfer.files;
        input.dispatchEvent(new Event('change', { bubbles: true }));
        statusElement.textContent = bootStatus(pendingFile.name, 'BOOTING');
        parent.postMessage({ type: 'arcade:ps2-source-accepted', core: 'ps2-play' }, location.origin);
        pendingFile = null;
        document.querySelector('#outputCanvas').focus();
        return true;
      }

      function loadPendingRemote() {
        const input = document.querySelector('input[type="file"]');
        if (!input || !pendingRemote) return false;
        const source = pendingRemote;
        const file = remoteDisc(source);
        document.body.classList.add('remote-disc');
        Object.defineProperty(input, 'files', { configurable: true, value: [file] });
        input.dispatchEvent(new Event('change', { bubbles: true }));
        statusElement.textContent = bootStatus(source.name, 'STREAMING');
        parent.postMessage({ type: 'arcade:ps2-source-accepted', core: 'ps2-play' }, location.origin);
        // The chunks a disc reads while booting are the ones worth warming
        // before a player reaches the cabinet. Guessing at the opening
        // megabytes holds for a disc whose executable sits near the front and
        // misses for one that does not, so report what this title actually
        // read: paste it into the registry entry as `bootChunks`.
        setTimeout(() => {
          const measured = bootChunks.chunks;
          if (!measured.length) return;
          console.info(`arcade: bootChunks for ${source.name} = ${JSON.stringify(measured)}`);
          parent.postMessage({ type: 'arcade:ps2-boot-chunks', core: 'ps2-play', name: source.name, chunks: measured }, location.origin);
        }, BOOT_RECORD_MS);
        pendingRemote = null;
        document.querySelector('#outputCanvas').focus();
        return true;
      }

      addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== parent) return;
        if (event.data?.type === 'arcade:ps2-load-file' && event.data.file instanceof File) {
          pendingFile = event.data.file;
          if (!loadPendingFile()) statusElement.textContent = 'PS2 CORE READYING FILE LOADER…';
          return;
        }
        if (event.data?.type === 'arcade:ps2-load-remote') {
          const { url, name, size } = event.data;
          if (typeof url !== 'string' || !url.startsWith('https://') || typeof name !== 'string' || !/\.(iso|chd|cso|isz|bin)$/i.test(name) || !Number.isSafeInteger(size) || size <= 0 || size > 16 * 1024 ** 3) return;
          pendingRemote = { url, name, size };
          if (!loadPendingRemote()) statusElement.textContent = 'PS2 CORE READYING REMOTE DISC…';
        }
      });

      if (!crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') {
        statusElement.textContent = 'PS2 CORE IS RUNNING WITHOUT THREADS // EXPECT HEAVY SLOWDOWN';
        console.warn('This page is not cross-origin isolated, so the PS2 core cannot use threads.');
        parent.postMessage({ type: 'arcade:ps2-degraded', core: 'ps2-play', reason: 'not-cross-origin-isolated' }, location.origin);
      }

      const readyPoll = setInterval(() => {
        const input = document.querySelector('input[type="file"]');
        if (!input) return;
        if (!readySent) {
          readySent = true;
          statusElement.textContent = 'PLAY! PS2 CORE READY // SELECT A LEGALLY DUMPED GAME IMAGE';
          input.addEventListener('change', () => {
            const file = input.files?.[0];
            if (file) statusElement.textContent = bootStatus(file.name, 'BOOTING');
          });
          parent.postMessage({ type: 'arcade:emulator-ready', core: 'ps2-play' }, location.origin);
        }
        loadPendingFile();
        loadPendingRemote();
        clearInterval(readyPoll);
      }, 100);

      addEventListener('error', () => parent.postMessage({ type: 'arcade:emulator-error', core: 'ps2-play' }, location.origin));
      addEventListener('unhandledrejection', () => parent.postMessage({ type: 'arcade:emulator-error', core: 'ps2-play' }, location.origin));
      addEventListener('pagehide', () => parent.postMessage({ type: 'arcade:emulator-closed', core: 'ps2-play' }, location.origin));
    </script>
    <script defer src="./main.js"></script>
  </body>
</html>
