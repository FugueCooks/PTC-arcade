<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play! PS2 Experimental Player</title>
    <link rel="stylesheet" href="./main.css" />
    <style>
      :root { color-scheme: dark; }
      html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#02030a; color:#d9d2e6; }
      body { font-family:"Courier New",monospace; }
      #ps2-shell { width:100%; height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; place-items:center; }
      #ps2-status { width:100%; box-sizing:border-box; padding:.55rem .8rem; color:#36f9f6; background:#080719; border-bottom:1px solid #543386; font-size:.72rem; letter-spacing:.08em; }
      #outputCanvas { width:100%; height:100%; min-height:0; object-fit:contain; background:#000; outline:none; }
      #root { width:100%; box-sizing:border-box; padding:.45rem .8rem; background:#080719; border-top:1px solid #543386; }
      #root input[type="file"] { max-width:100%; color:#fff; }
      #root button, #root input::file-selector-button { padding:.45rem .7rem; color:#36f9f6; background:#100b22; border:1px solid #36f9f6; font:inherit; cursor:pointer; }
      span.version, span.stats { color:#a99abe; font-size:.65rem; }
      body.remote-disc #root { position:absolute; right:.65rem; bottom:.55rem; width:auto; padding:.28rem .5rem; border:1px solid #36f9f655; border-radius:4px; background:#050510c7; pointer-events:none; }
      body.remote-disc #root input, body.remote-disc #root .version { display:none; }
      body.remote-disc #root .stats { float:none; color:#8ffdfa; letter-spacing:.05em; }
      #ps2-controller-menu {
        position:fixed;
        z-index:30;
        top:2.7rem;
        right:.65rem;
        display:grid;
        justify-items:end;
        gap:.4rem;
        font-size:.62rem;
      }
      #ps2-controller-toggle {
        min-width:7.25rem;
        padding:.5rem .7rem;
        color:#36f9f6;
        background:#080719e8;
        border:1px solid #36f9f6;
        border-radius:.25rem;
        font:700 .62rem "Courier New",monospace;
        letter-spacing:.05em;
      }
      #ps2-controller-help {
        width:min(19rem,calc(100vw - 1.3rem));
        padding:.65rem .75rem;
        color:#d9d2e6;
        background:#050510ed;
        border:1px solid #543386;
        box-shadow:0 0 1.3rem #36f9f633;
        line-height:1.55;
      }
      #ps2-controller-help[hidden] { display:none; }
      #ps2-controller-status { color:#fff4a8; }
      #ps2-controller-help strong { color:#36f9f6; }
      #ps2-touch-controls { display:none; }
      body.touch-controls #ps2-touch-controls {
        position:fixed;
        inset:0;
        z-index:20;
        display:block;
        pointer-events:none;
        touch-action:none;
        user-select:none;
        -webkit-user-select:none;
        -webkit-touch-callout:none;
      }
      .ps2-touch-button {
        width:clamp(2.45rem,8.5vmin,4rem);
        height:clamp(2.45rem,8.5vmin,4rem);
        display:grid;
        place-items:center;
        padding:0;
        color:#e9ffff;
        background:#071321b8;
        border:1px solid #58fff1aa;
        border-radius:50%;
        box-shadow:0 0 .8rem #00e9ff44,inset 0 0 .8rem #00e9ff1f;
        font:700 clamp(.68rem,2.5vmin,1rem)/1 "Courier New",monospace;
        pointer-events:auto;
        touch-action:none;
      }
      .ps2-touch-button.is-active {
        color:#071018;
        background:#54fff1e8;
        box-shadow:0 0 1.15rem #37fff4cc;
        transform:scale(.94);
      }
      .ps2-touch-shoulders {
        position:absolute;
        top:2.65rem;
        left:50%;
        display:flex;
        gap:.38rem;
        transform:translateX(-50%);
      }
      .ps2-touch-shoulders .ps2-touch-button {
        width:clamp(2.2rem,8vmin,3.5rem);
        height:clamp(1.8rem,6vmin,2.35rem);
        border-radius:.45rem;
      }
      .ps2-touch-movement,
      .ps2-touch-camera,
      .ps2-touch-face {
        position:absolute;
        bottom:max(.75rem,env(safe-area-inset-bottom));
        display:grid;
        grid-template-columns:repeat(3,clamp(2.45rem,8.5vmin,4rem));
        grid-template-rows:repeat(3,clamp(2.45rem,8.5vmin,4rem));
        gap:.18rem;
      }
      .ps2-touch-movement { left:max(.75rem,env(safe-area-inset-left)); }
      .ps2-touch-face { right:max(.75rem,env(safe-area-inset-right)); }
      .ps2-touch-camera {
        left:50%;
        bottom:max(3.75rem,calc(env(safe-area-inset-bottom) + 3.25rem));
        grid-template-columns:repeat(3,clamp(1.65rem,5.5vmin,2.35rem));
        grid-template-rows:repeat(3,clamp(1.65rem,5.5vmin,2.35rem));
        transform:translateX(-50%);
        opacity:.82;
      }
      .ps2-touch-camera .ps2-touch-button {
        width:clamp(1.65rem,5.5vmin,2.35rem);
        height:clamp(1.65rem,5.5vmin,2.35rem);
        font-size:clamp(.5rem,1.7vmin,.7rem);
      }
      .ps2-touch-label {
        align-self:center;
        color:#8ffdfa;
        font-size:clamp(.42rem,1.5vmin,.58rem);
        text-align:center;
        text-shadow:0 0 .4rem #00ffff;
      }
      .ps2-touch-system {
        position:absolute;
        left:50%;
        bottom:max(.55rem,env(safe-area-inset-bottom));
        display:flex;
        gap:.45rem;
        transform:translateX(-50%);
      }
      .ps2-touch-system .ps2-touch-button {
        width:auto;
        min-width:3.25rem;
        height:1.85rem;
        padding:0 .65rem;
        border-radius:1rem;
        font-size:.58rem;
      }
      .ps2-grid-up { grid-column:2; grid-row:1; }
      .ps2-grid-left { grid-column:1; grid-row:2; }
      .ps2-grid-center { grid-column:2; grid-row:2; }
      .ps2-grid-right { grid-column:3; grid-row:2; }
      .ps2-grid-down { grid-column:2; grid-row:3; }
      .ps2-face-triangle { grid-column:2; grid-row:1; color:#67ff9c; }
      .ps2-face-square { grid-column:1; grid-row:2; color:#ff82e8; }
      .ps2-face-circle { grid-column:3; grid-row:2; color:#ff7b87; }
      .ps2-face-cross { grid-column:2; grid-row:3; color:#70b7ff; }
      @media (max-width:700px) and (orientation:portrait) {
        .ps2-touch-camera { display:none; }
        .ps2-touch-shoulders { top:2.35rem; }
      }
      @media (prefers-reduced-motion:reduce) {
        .ps2-touch-button { transition:none; }
      }
    </style>
  </head>
  <body>
    <main id="ps2-shell">
      <div id="ps2-status">PLAY! WEBASSEMBLY // INITIALIZING EXPERIMENTAL PS2 CORE…</div>
      <canvas id="outputCanvas" width="640" height="480" tabindex="0"></canvas>
      <div id="root"></div>
      <aside id="ps2-controller-menu">
        <button id="ps2-controller-toggle" type="button" aria-expanded="false">CONTROLS</button>
        <div id="ps2-controller-help" hidden>
          <div id="ps2-controller-status">CONTROLLER: CONNECT OR PRESS A BUTTON</div>
          <div><strong>LEFT STICK / D-PAD</strong> MOVE</div>
          <div><strong>RIGHT STICK</strong> CAMERA</div>
          <div><strong>A / B / X / Y</strong> × / ○ / □ / △</div>
          <div><strong>LB / LT / RB / RT</strong> L1 / L2 / R1 / R2</div>
          <div><strong>MENU / VIEW</strong> START / SELECT</div>
        </div>
      </aside>
      <section id="ps2-touch-controls" aria-label="PlayStation 2 touch controller">
        <div class="ps2-touch-shoulders">
          <button class="ps2-touch-button" data-ps2-keys="Key1" aria-label="L1">L1</button>
          <button class="ps2-touch-button" data-ps2-keys="Key2" aria-label="L2">L2</button>
          <button class="ps2-touch-button" data-ps2-keys="Key9" aria-label="R2">R2</button>
          <button class="ps2-touch-button" data-ps2-keys="Key8" aria-label="R1">R1</button>
        </div>
        <div class="ps2-touch-movement" aria-label="Movement and directional pad">
          <button class="ps2-touch-button ps2-grid-up" data-ps2-keys="KeyT ArrowUp" aria-label="Move up">▲</button>
          <button class="ps2-touch-button ps2-grid-left" data-ps2-keys="KeyF ArrowLeft" aria-label="Move left">◀</button>
          <span class="ps2-touch-label ps2-grid-center">MOVE</span>
          <button class="ps2-touch-button ps2-grid-right" data-ps2-keys="KeyH ArrowRight" aria-label="Move right">▶</button>
          <button class="ps2-touch-button ps2-grid-down" data-ps2-keys="KeyG ArrowDown" aria-label="Move down">▼</button>
        </div>
        <div class="ps2-touch-camera" aria-label="Camera stick">
          <button class="ps2-touch-button ps2-grid-up" data-ps2-keys="KeyI" aria-label="Camera up">▲</button>
          <button class="ps2-touch-button ps2-grid-left" data-ps2-keys="KeyJ" aria-label="Camera left">◀</button>
          <span class="ps2-touch-label ps2-grid-center">CAM</span>
          <button class="ps2-touch-button ps2-grid-right" data-ps2-keys="KeyL" aria-label="Camera right">▶</button>
          <button class="ps2-touch-button ps2-grid-down" data-ps2-keys="KeyK" aria-label="Camera down">▼</button>
        </div>
        <div class="ps2-touch-face" aria-label="Action buttons">
          <button class="ps2-touch-button ps2-face-triangle" data-ps2-keys="KeyS" aria-label="Triangle">△</button>
          <button class="ps2-touch-button ps2-face-square" data-ps2-keys="KeyA" aria-label="Square">□</button>
          <button class="ps2-touch-button ps2-face-circle" data-ps2-keys="KeyX" aria-label="Circle">○</button>
          <button class="ps2-touch-button ps2-face-cross" data-ps2-keys="KeyZ" aria-label="Cross">×</button>
        </div>
        <div class="ps2-touch-system">
          <button class="ps2-touch-button" data-ps2-keys="Backspace" aria-label="Select">SELECT</button>
          <button class="ps2-touch-button" data-ps2-keys="Enter" aria-label="Start">START</button>
        </div>
      </section>
    </main>
    <script type="module">
      import { GAMEPAD_AXES, GAMEPAD_BUTTONS, DEFAULT_DEAD_ZONE, buttonPressed, pickGamepad } from '../gamepad-mapping.js?v=input-and-loading-1';
      import { RANGE_CHUNK_BYTES, fetchDiscRange, openDiscRangeCache } from '../disc-range-cache.js?v=input-and-loading-1';

      const statusElement = document.querySelector('#ps2-status');
      let pendingFile = null;
      let pendingRemote = null;
      let readySent = false;
      let discFailureReported = false;

      const PS2_KEYS = Object.freeze({
        ArrowLeft: { key: 'ArrowLeft', keyCode: 37 },
        ArrowUp: { key: 'ArrowUp', keyCode: 38 },
        ArrowRight: { key: 'ArrowRight', keyCode: 39 },
        ArrowDown: { key: 'ArrowDown', keyCode: 40 },
        Backspace: { key: 'Backspace', keyCode: 8 },
        Enter: { key: 'Enter', keyCode: 13 },
        Key1: { key: '1', keyCode: 49 },
        Key2: { key: '2', keyCode: 50 },
        Key8: { key: '8', keyCode: 56 },
        Key9: { key: '9', keyCode: 57 },
        KeyA: { key: 'a', keyCode: 65 },
        KeyF: { key: 'f', keyCode: 70 },
        KeyG: { key: 'g', keyCode: 71 },
        KeyH: { key: 'h', keyCode: 72 },
        KeyI: { key: 'i', keyCode: 73 },
        KeyJ: { key: 'j', keyCode: 74 },
        KeyK: { key: 'k', keyCode: 75 },
        KeyL: { key: 'l', keyCode: 76 },
        KeyS: { key: 's', keyCode: 83 },
        KeyT: { key: 't', keyCode: 84 },
        KeyX: { key: 'x', keyCode: 88 },
        KeyZ: { key: 'z', keyCode: 90 }
      });
      const activeTouchKeys = new Map();
      const activeGamepadKeys = new Set();
      const CONTROLLER_IDLE_STATUS = 'CONTROLLER: CONNECT OR PRESS A BUTTON';
      const GAMEPAD_KEY_BINDINGS = Object.freeze([
        { code: 'KeyZ', button: GAMEPAD_BUTTONS.SOUTH },
        { code: 'KeyX', button: GAMEPAD_BUTTONS.EAST },
        { code: 'KeyA', button: GAMEPAD_BUTTONS.WEST },
        { code: 'KeyS', button: GAMEPAD_BUTTONS.NORTH },
        { code: 'Key1', button: GAMEPAD_BUTTONS.L1 },
        { code: 'Key8', button: GAMEPAD_BUTTONS.R1 },
        { code: 'Key2', button: GAMEPAD_BUTTONS.L2 },
        { code: 'Key9', button: GAMEPAD_BUTTONS.R2 },
        { code: 'Backspace', button: GAMEPAD_BUTTONS.SELECT },
        { code: 'Enter', button: GAMEPAD_BUTTONS.START },
        { code: 'ArrowUp', button: GAMEPAD_BUTTONS.DPAD_UP },
        { code: 'ArrowDown', button: GAMEPAD_BUTTONS.DPAD_DOWN },
        { code: 'ArrowLeft', button: GAMEPAD_BUTTONS.DPAD_LEFT },
        { code: 'ArrowRight', button: GAMEPAD_BUTTONS.DPAD_RIGHT }
      ]);
      const GAMEPAD_AXIS_BINDINGS = Object.freeze([
        { negative: 'KeyF', positive: 'KeyH', axis: GAMEPAD_AXES.LEFT_X },
        { negative: 'KeyT', positive: 'KeyG', axis: GAMEPAD_AXES.LEFT_Y },
        { negative: 'KeyJ', positive: 'KeyL', axis: GAMEPAD_AXES.RIGHT_X },
        { negative: 'KeyI', positive: 'KeyK', axis: GAMEPAD_AXES.RIGHT_Y }
      ]);

      function dispatchPs2Key(code, pressed) {
        const definition = PS2_KEYS[code];
        if (!definition) return;
        const canvas = document.querySelector('#outputCanvas');
        const event = new KeyboardEvent(pressed ? 'keydown' : 'keyup', {
          key: definition.key,
          code,
          bubbles: true,
          cancelable: true
        });
        // Play!'s Emscripten input bridge reads legacy numeric fields as well
        // as key/code. Browser-created KeyboardEvents leave those fields at 0.
        Object.defineProperty(event, 'keyCode', { get: () => definition.keyCode });
        Object.defineProperty(event, 'which', { get: () => definition.keyCode });
        canvas.dispatchEvent(event);
      }

      function setGamepadKey(code, pressed) {
        const active = activeGamepadKeys.has(code);
        if (pressed === active) return;
        if (pressed) activeGamepadKeys.add(code);
        else activeGamepadKeys.delete(code);
        dispatchPs2Key(code, pressed);
      }

      function releaseGamepadKeys() {
        for (const code of [...activeGamepadKeys]) setGamepadKey(code, false);
      }

      function setControllerStatus(text) {
        if (controllerStatusElement.textContent !== text) controllerStatusElement.textContent = text;
      }

      /**
       * Runs only while a pad is connected. This shares a frame budget with a
       * PS2 core, so the poll holds its element references, writes the status
       * line only when it changes, and stops altogether rather than spinning an
       * animation frame forever on a machine that has no controller at all.
       */
      function pollPs2Gamepad() {
        gamepadPollHandle = null;
        const gamepad = pickGamepad(navigator.getGamepads?.(), activeGamepadIndex);
        if (!gamepad) {
          activeGamepadIndex = null;
          releaseGamepadKeys();
          setControllerStatus(CONTROLLER_IDLE_STATUS);
          return;
        }
        activeGamepadIndex = gamepad.index;
        setControllerStatus(`CONTROLLER: ${gamepad.id || 'STANDARD GAMEPAD'} READY`);
        for (const binding of GAMEPAD_KEY_BINDINGS) setGamepadKey(binding.code, buttonPressed(gamepad, binding.button));
        for (const binding of GAMEPAD_AXIS_BINDINGS) {
          const value = gamepad.axes?.[binding.axis] ?? 0;
          setGamepadKey(binding.negative, value < -DEFAULT_DEAD_ZONE);
          setGamepadKey(binding.positive, value > DEFAULT_DEAD_ZONE);
        }
        if (activeGamepadKeys.size) outputCanvas.focus({ preventScroll: true });
        scheduleGamepadPoll();
      }

      function scheduleGamepadPoll() {
        if (gamepadPollHandle === null) gamepadPollHandle = requestAnimationFrame(pollPs2Gamepad);
      }

      const controllerToggle = document.querySelector('#ps2-controller-toggle');
      const controllerHelp = document.querySelector('#ps2-controller-help');
      const controllerStatusElement = document.querySelector('#ps2-controller-status');
      const outputCanvas = document.querySelector('#outputCanvas');
      let gamepadPollHandle = null;
      let activeGamepadIndex = null;
      controllerToggle.addEventListener('click', () => {
        const open = controllerHelp.hidden;
        controllerHelp.hidden = !open;
        controllerToggle.setAttribute('aria-expanded', String(open));
      });
      addEventListener('gamepadconnected', event => {
        activeGamepadIndex = event.gamepad.index;
        setControllerStatus(`CONTROLLER: ${event.gamepad.id || 'STANDARD GAMEPAD'} READY`);
        controllerHelp.hidden = false;
        controllerToggle.setAttribute('aria-expanded', 'true');
        outputCanvas.focus({ preventScroll: true });
        scheduleGamepadPoll();
      });
      addEventListener('gamepaddisconnected', () => {
        releaseGamepadKeys();
        setControllerStatus(CONTROLLER_IDLE_STATUS);
      });
      // A pad connected before this frame loaded only surfaces once the page
      // has seen it, so take one look now and then wait for the connect event.
      scheduleGamepadPoll();

      function releaseTouchPointer(pointerId) {
        const active = activeTouchKeys.get(pointerId);
        if (!active) return;
        activeTouchKeys.delete(pointerId);
        for (const code of active.codes) dispatchPs2Key(code, false);
        active.button.classList.remove('is-active');
      }

      function initializeTouchControls() {
        const hasTouch = navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches;
        if (!hasTouch) return;
        document.body.classList.add('touch-controls');
        const canvas = document.querySelector('#outputCanvas');
        for (const button of document.querySelectorAll('[data-ps2-keys]')) {
          button.addEventListener('pointerdown', event => {
            if (activeTouchKeys.has(event.pointerId)) return;
            event.preventDefault();
            canvas.focus({ preventScroll: true });
            const codes = button.dataset.ps2Keys.split(/\s+/).filter(Boolean);
            activeTouchKeys.set(event.pointerId, { button, codes });
            button.classList.add('is-active');
            button.setPointerCapture?.(event.pointerId);
            for (const code of codes) dispatchPs2Key(code, true);
          });
          for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
            button.addEventListener(type, event => {
              event.preventDefault();
              releaseTouchPointer(event.pointerId);
            });
          }
          button.addEventListener('contextmenu', event => event.preventDefault());
        }
        addEventListener('blur', () => {
          for (const pointerId of [...activeTouchKeys.keys()]) releaseTouchPointer(pointerId);
          releaseGamepadKeys();
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) for (const pointerId of [...activeTouchKeys.keys()]) releaseTouchPointer(pointerId);
        });
      }

      initializeTouchControls();

      function reportDiscFailure(error, start, end) {
        if (discFailureReported) return;
        discFailureReported = true;
        const message = error instanceof Error ? error.message : 'Unknown remote disc error.';
        console.error('PS2 remote disc read failed.', { start, end, message });
        statusElement.textContent = `DISC READ FAILED AT ${Math.floor(start / 1024 ** 2)} MB // RETRY THE CABINET OR CACHE THE GAME LOCALLY`;
        parent.postMessage({ type: 'arcade:ps2-disc-error', core: 'ps2-play', message }, location.origin);
      }

      function remoteDisc(source) {
        const chunkSize = RANGE_CHUNK_BYTES;
        const maxCachedChunks = 40;
        const readAheadChunks = navigator.connection?.saveData ? 0 : (navigator.connection?.downlink >= 10 ? 4 : 2);
        const maxPersistentChunks = navigator.deviceMemory && navigator.deviceMemory <= 4 ? 32 : 128;
        const chunks = new Map();
        const persistentCache = openDiscRangeCache(source, maxPersistentChunks);
        const persistentWrites = new Set();
        let persistentCacheFailed = false;

        async function loadChunk(index, start, end) {
          const persistent = await persistentCache;
          const cached = await persistent?.get(index, end - start);
          if (cached) return cached;
          const buffer = await fetchDiscRange(source.url, start, end);
          if (persistent && !persistentCacheFailed && !persistentWrites.has(index)) {
            persistentWrites.add(index);
            void persistent.put(index, buffer).catch(error => {
              persistentCacheFailed = true;
              console.warn('Could not persist a PS2 disc range.', error);
            });
          }
          return buffer;
        }

        function cachedChunk(index) {
          const existing = chunks.get(index);
          if (existing) {
            chunks.delete(index);
            chunks.set(index, existing);
            return existing;
          }
          const start = index * chunkSize;
          const end = Math.min(source.size, start + chunkSize);
          const request = loadChunk(index, start, end).catch(error => {
            chunks.delete(index);
            throw error;
          });
          chunks.set(index, request);
          while (chunks.size > maxCachedChunks) chunks.delete(chunks.keys().next().value);
          return request;
        }

        async function read(start, end) {
          if (end <= start) return new ArrayBuffer(0);
          const firstChunk = Math.floor(start / chunkSize);
          const lastChunk = Math.floor((end - 1) / chunkSize);
          const requests = [];
          for (let index = firstChunk; index <= lastChunk; index += 1) requests.push(cachedChunk(index));
          const buffers = await Promise.all(requests);
          // Play! performs many small, nearby disc reads. Warm the next chunks
          // after each demand read so gameplay does not repeatedly wait on CDN
          // round trips, while retaining a strict bounded memory cache.
          for (let offset = 1; offset <= readAheadChunks; offset += 1) {
            const nextChunk = lastChunk + offset;
            if (nextChunk * chunkSize >= source.size) break;
            void cachedChunk(nextChunk).catch(() => {});
          }
          if (buffers.length === 1) {
            const offset = start - firstChunk * chunkSize;
            return buffers[0].slice(offset, offset + (end - start));
          }
          const output = new Uint8Array(end - start);
          let written = 0;
          for (let index = 0; index < buffers.length; index += 1) {
            const chunkIndex = firstChunk + index;
            const chunkStart = chunkIndex * chunkSize;
            const copyStart = Math.max(start, chunkStart);
            const copyEnd = Math.min(end, chunkStart + buffers[index].byteLength);
            const sourceOffset = copyStart - chunkStart;
            const length = copyEnd - copyStart;
            output.set(new Uint8Array(buffers[index], sourceOffset, length), written);
            written += length;
          }
          return output.buffer;
        }

        return Object.freeze({
          name: source.name,
          size: source.size,
          slice(start, end) {
            const numericStart = Number(start);
            const numericEnd = end === undefined ? source.size : Number(end);
            const safeStart = Math.floor(Math.max(0, Math.min(source.size, Number.isFinite(numericStart) ? numericStart : 0)));
            const safeEnd = Math.floor(Math.max(safeStart, Math.min(source.size, Number.isFinite(numericEnd) ? numericEnd : source.size)));
            return {
              arrayBuffer: () => read(safeStart, safeEnd).catch(error => {
                reportDiscFailure(error, safeStart, safeEnd);
                throw error;
              })
            };
          }
        });
      }

      function bootStatus(name, mode) {
        const title = name.toUpperCase();
        if (/KINGDOM[-_ ]HEARTS/.test(title)) return `${mode} ${title} // BLACK INTRO MOVIE? PRESS ENTER ONCE TO SKIP`;
        return `${mode} ${title} // VISITED DISC DATA CACHES AUTOMATICALLY`;
      }

      function loadPendingFile() {
        const input = document.querySelector('input[type="file"]');
        if (!input || !pendingFile) return false;
        const transfer = new DataTransfer();
        transfer.items.add(pendingFile);
        input.files = transfer.files;
        input.dispatchEvent(new Event('change', { bubbles: true }));
        statusElement.textContent = bootStatus(pendingFile.name, 'BOOTING');
        parent.postMessage({ type: 'arcade:ps2-source-accepted', core: 'ps2-play' }, location.origin);
        pendingFile = null;
        document.querySelector('#outputCanvas').focus();
        return true;
      }

      function loadPendingRemote() {
        const input = document.querySelector('input[type="file"]');
        if (!input || !pendingRemote) return false;
        const source = pendingRemote;
        const file = remoteDisc(source);
        document.body.classList.add('remote-disc');
        Object.defineProperty(input, 'files', { configurable: true, value: [file] });
        input.dispatchEvent(new Event('change', { bubbles: true }));
        statusElement.textContent = bootStatus(source.name, 'STREAMING');
        parent.postMessage({ type: 'arcade:ps2-source-accepted', core: 'ps2-play' }, location.origin);
        pendingRemote = null;
        document.querySelector('#outputCanvas').focus();
        return true;
      }

      addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== parent) return;
        if (event.data?.type === 'arcade:ps2-load-file' && event.data.file instanceof File) {
          pendingFile = event.data.file;
          if (!loadPendingFile()) statusElement.textContent = 'PS2 CORE READYING FILE LOADER…';
          return;
        }
        if (event.data?.type === 'arcade:ps2-load-remote') {
          const { url, name, size } = event.data;
          if (typeof url !== 'string' || !url.startsWith('https://') || typeof name !== 'string' || !/\.(iso|chd|cso|isz|bin)$/i.test(name) || !Number.isSafeInteger(size) || size <= 0 || size > 16 * 1024 ** 3) return;
          pendingRemote = { url, name, size };
          if (!loadPendingRemote()) statusElement.textContent = 'PS2 CORE READYING REMOTE DISC…';
        }
      });

      const readyPoll = setInterval(() => {
        const input = document.querySelector('input[type="file"]');
        if (!input) return;
        if (!readySent) {
          readySent = true;
          statusElement.textContent = 'PLAY! PS2 CORE READY // SELECT A LEGALLY DUMPED GAME IMAGE';
          input.addEventListener('change', () => {
            const file = input.files?.[0];
            if (file) statusElement.textContent = bootStatus(file.name, 'BOOTING');
          });
          parent.postMessage({ type: 'arcade:emulator-ready', core: 'ps2-play' }, location.origin);
        }
        loadPendingFile();
        loadPendingRemote();
        clearInterval(readyPoll);
      }, 100);

      addEventListener('error', () => parent.postMessage({ type: 'arcade:emulator-error', core: 'ps2-play' }, location.origin));
      addEventListener('unhandledrejection', () => parent.postMessage({ type: 'arcade:emulator-error', core: 'ps2-play' }, location.origin));
      addEventListener('pagehide', () => parent.postMessage({ type: 'arcade:emulator-closed', core: 'ps2-play' }, location.origin));
    </script>
    <script defer src="./main.js"></script>
  </body>
</html>
