app = "retro-arcade-fugue"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  TRUST_PROXY = "1"
  GAME_ASSET_BASE_URL = "https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/games"
  BIOS_ASSET_URL = "https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/bios/SCPH1001.BIN"
  GAMECUBE_DSP_ASSET_URL = "https://pub-88860093179f4c448466f5a36bf8e618.r2.dev/arcade/bios/dsp_rom.bin"

  # Public origin for ptcarcade.fun. PUBLIC_APP_ORIGIN gates cross-site mutation
  # on the auth and account APIs, and SOLANA_APP_DOMAIN is the domain a wallet
  # displays when a player signs in — it must match the address bar exactly or
  # wallets will warn on, or refuse, the signature.
  PUBLIC_APP_ORIGIN = "https://ptcarcade.fun"
  SOLANA_APP_DOMAIN = "ptcarcade.fun"
  SOLANA_APP_URI = "https://ptcarcade.fun"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 750

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
