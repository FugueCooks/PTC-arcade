<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,body,#game { width:100%; height:100%; margin:0; overflow:hidden; background:#02030a; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      const parameters = new URLSearchParams(location.search);
      window.EJS_player = '#game';
      const requestedCore = parameters.get('core');
      const requestedGame = parameters.get('game');
      window.EJS_core = requestedCore;
      window.EJS_gameUrl = requestedGame;
      window.EJS_biosUrl = parameters.get('bios');
      window.EJS_gameName = parameters.get('name') || 'Arcade Game';
      const persistentGameId = Number(parameters.get('id')) || 1;
      let saveEntitled = false;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_askBeforeExit = false;
      function walletSaveGameId(subject) {
        // EmulatorJS requires a numeric ID. FNV-1a gives a stable unsigned ID
        // without exposing the public player ID to its storage schema.
        const input = `${subject}:${persistentGameId}`;
        let hash = 0x811c9dc5;
        for (let index = 0; index < input.length; index += 1) {
          hash ^= input.charCodeAt(index);
          hash = Math.imul(hash, 0x01000193);
        }
        return (hash >>> 0) || 1;
      }
      function configureSavePolicy(policy) {
        saveEntitled = policy?.allowed === true && typeof policy.subject === 'string';
        // A wallet session receives the game's stable ID, so its browser save
        // survives later cabinet visits. Guests receive a fresh ID every boot,
        // which prevents previously persisted data from being restored even if
        // the upstream runtime performs an unexpected background write.
        const ephemeral = crypto.getRandomValues(new Uint32Array(1))[0] || 1;
        window.EJS_gameID = saveEntitled ? walletSaveGameId(policy.subject) : ephemeral;
        if (saveEntitled) window.EJS_fixedSaveInterval = 7000;
        else delete window.EJS_fixedSaveInterval;
        window.EJS_defaultOptions = saveEntitled
          ? { 'save-state-location': 'browser', 'save-save-interval': 0 }
          : { 'save-state-location': 'download', 'save-save-interval': 0 };
        // Guests retain ordinary graphics/input settings, but cannot reopen
        // persistence through the advanced settings menu.
        window.EJS_hideSettings = saveEntitled ? [] : ['save-state-location', 'save-save-interval'];
        window.EJS_Buttons = {
          saveState: saveEntitled,
          loadState: saveEntitled,
          quickSave: saveEntitled,
          quickLoad: saveEntitled,
          saveSavFiles: saveEntitled,
          loadSavFiles: saveEntitled,
          gamepad: true,
          settings: true
        };
        parent.postMessage({ type: 'arcade:save-entitlement', allowed: saveEntitled }, location.origin);
      }
      async function resolveSaveEntitlement() {
        try {
          const response = await fetch('/api/auth/session', { credentials: 'same-origin', cache: 'no-store' });
          if (!response.ok) return { allowed: false, subject: null };
          const payload = await response.json();
          const allowed = payload?.entitlements?.canPersistGameSaves === true;
          const subject = payload?.identity?.publicPlayerId;
          return { allowed, subject: typeof subject === 'string' ? subject : null };
        } catch { return { allowed: false, subject: null }; }
      }
      // EmulatorJS currently has two settings stores. Some stable builds
      // repopulate `allSettings` after applying EJS_defaultOptions, which makes
      // the menu look correct while Save State still downloads a file instead
      // of persisting it. Apply the option to the live emulator after its
      // settings UI exists as well as supplying the documented startup option.
      function enforceBrowserSavePersistence() {
        const emulator = window.EJS_emulator;
        if (!emulator) return false;
        emulator.settings = {
          ...(emulator.settings || {}),
          'save-state-location': saveEntitled ? 'browser' : 'download',
          'save-save-interval': saveEntitled ? '7' : '0'
        };
        if (emulator.allSettings && typeof emulator.allSettings === 'object') {
          emulator.allSettings['save-state-location'] = saveEntitled ? 'browser' : 'download';
          emulator.allSettings['save-save-interval'] = saveEntitled ? '7' : '0';
        }
        return true;
      }
      function enforceBrowserSavePersistenceWithRetries() {
        let attempts = 0;
        const apply = () => {
          attempts += 1;
          if (!enforceBrowserSavePersistence() && attempts < 20) {
            setTimeout(apply, 250);
          }
        };
        apply();
      }
      window.EJS_ready = enforceBrowserSavePersistenceWithRetries;
      window.EJS_onGameStart = () => { window.__arcadeGameStarted = true; enforceBrowserSavePersistenceWithRetries(); };

      let stopRequested = false;
      async function flushAndStopEmulator() {
        if (stopRequested) return;
        stopRequested = true;
        const emulator = window.EJS_emulator;
        enforceBrowserSavePersistence();
        // Removing the guest iframe without invoking the emulator's exit path
        // intentionally avoids its final save-file flush.
        if (!saveEntitled) {
          parent.postMessage({ type: 'arcade:emulator-stopped' }, location.origin);
          return;
        }
        try {
          const saveOwner = typeof emulator?.gameManager?.saveSaveFiles === 'function'
            ? emulator.gameManager
            : (typeof emulator?.saveSaveFiles === 'function' ? emulator : null);
          await saveOwner?.saveSaveFiles?.();
        } catch (error) {
          console.warn('Could not flush emulator save files before exit.', error);
        }
        try {
          if (typeof window.EJS_terminate === 'function') window.EJS_terminate();
          else if (typeof emulator?.exit === 'function') emulator.exit();
        } finally {
          parent.postMessage({ type: 'arcade:emulator-stopped' }, location.origin);
        }
      }
      addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== parent) return;
        if (event.data?.type === 'arcade:emulator-stop') void flushAndStopEmulator();
      });
      // Every failure used to collapse into one opaque "could not load", which
      // made a blocked script indistinguishable from a bad ROM. Report why.
      // Only failures that actually stop the game get reported. EmulatorJS
      // leaves benign rejections uncaught (WakeLock and pointer-lock denials,
      // fullscreen refusals), and once the game is running no stray script
      // error should tear down a working session.
      const BENIGN_ERROR = /wake ?lock|pointer ?lock|wrongdocumenterror|notallowederror|fullscreen|permissions policy|request was interrupted|aborterror|not visible/i;
      function reportError(detail) {
        const text = String(detail).slice(0, 300);
        if (window.__arcadeGameStarted || BENIGN_ERROR.test(text)) {
          console.warn('[player] non-fatal emulator error:', text);
          return;
        }
        parent.postMessage({ type: 'arcade:emulator-error', detail: text }, location.origin);
      }
      addEventListener('error', (event) => reportError(event?.message || 'script error'));
      addEventListener('unhandledrejection', (event) => reportError(event?.reason?.message || event?.reason || 'promise rejection'));
      addEventListener('pagehide', () => parent.postMessage({ type: 'arcade:emulator-closed' }, location.origin));

      // Both of these used to fail quietly, and quietly is the whole problem:
      // an unrecognized core fell back to 'psx', and a missing ROM started the
      // core with no content, so the player got a working-looking emulator
      // sitting in its own menu with nothing to say what went wrong.
      const supportedCores = ['psx', 'n64', 'snes9x', 'gambatte', 'mgba', 'melonds'];
      const startable = supportedCores.includes(requestedCore) && Boolean(requestedGame);
    </script>
    <script>
      /**
       * The server sends Cross-Origin-Embedder-Policy: credentialless for the
       * PS2 core's SharedArrayBuffer workers, and that policy also governs this
       * page. Under COEP a cross-origin script is admitted two different ways:
       * a no-cors load whose response carries CORP, or a CORS load whose
       * response carries Access-Control-Allow-Origin.
       *
       * Which one the CDN supports cannot be assumed, and picking wrong turns a
       * working emulator into a blocked one, so both are tried: CORS first,
       * then a plain load, and only then is it reported as a failure.
       */
      function loadEmulatorRuntime(useCors) {
        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        if (useCors) script.crossOrigin = 'anonymous';
        script.onload = () => parent.postMessage({ type: 'arcade:emulator-ready' }, location.origin);
        script.onerror = () => {
          if (useCors) { loadEmulatorRuntime(false); return; }
          reportError('loader.js was blocked or unreachable with and without CORS (check COEP and the CDN)');
        };
        document.body.append(script);
      }
      if (!supportedCores.includes(requestedCore)) {
        reportError(`unsupported core "${requestedCore ?? 'none'}" — the cabinet asked for a core this player does not have`);
      } else if (!requestedGame) {
        reportError('no game URL was supplied, so the core would boot into its own menu');
      }
      if (startable) {
        void resolveSaveEntitlement().then((policy) => {
          configureSavePolicy(policy);
          loadEmulatorRuntime(true);
        });
      }
    </script>
  </body>
</html>
