<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,body,#game { width:100%; height:100%; margin:0; overflow:hidden; background:#02030a; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      const parameters = new URLSearchParams(location.search);
      window.EJS_player = '#game';
      window.EJS_core = parameters.get('core') === 'n64' ? 'n64' : 'psx';
      window.EJS_gameUrl = parameters.get('game');
      window.EJS_biosUrl = parameters.get('bios');
      window.EJS_gameName = parameters.get('name') || 'Arcade Game';
      window.EJS_gameID = Number(parameters.get('id')) || 1;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_askBeforeExit = false;
      // Browser saves persist between cabinet visits on this device and browser.
      window.EJS_fixedSaveInterval = 7000;
      window.EJS_defaultOptions = { 'save-state-location': 'browser' };
      window.EJS_Buttons = {
        saveState: true,
        loadState: true,
        quickSave: true,
        quickLoad: true,
        saveSavFiles: true,
        loadSavFiles: true,
        gamepad: true,
        settings: true
      };
      addEventListener('error', () => parent.postMessage({ type: 'arcade:emulator-error' }, location.origin));
      addEventListener('unhandledrejection', () => parent.postMessage({ type: 'arcade:emulator-error' }, location.origin));
      addEventListener('pagehide', () => parent.postMessage({ type: 'arcade:emulator-closed' }, location.origin));
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js" onload="parent.postMessage({type:'arcade:emulator-ready'},location.origin)" onerror="parent.postMessage({type:'arcade:emulator-error'},location.origin)"></script>
  </body>
</html>
