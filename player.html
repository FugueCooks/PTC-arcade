<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,body,#game { width:100%; height:100%; margin:0; overflow:hidden; background:#02030a; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      const parameters = new URLSearchParams(location.search);
      window.EJS_player = '#game';
      const requestedCore = parameters.get('core');
      window.EJS_core = ['psx', 'n64', 'snes9x'].includes(requestedCore) ? requestedCore : 'psx';
      window.EJS_gameUrl = parameters.get('game');
      window.EJS_biosUrl = parameters.get('bios');
      window.EJS_gameName = parameters.get('name') || 'Arcade Game';
      window.EJS_gameID = Number(parameters.get('id')) || 1;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_askBeforeExit = false;
      // Browser saves persist between cabinet visits on this device and browser.
      window.EJS_fixedSaveInterval = 7000;
      window.EJS_defaultOptions = { 'save-state-location': 'browser' };
      window.EJS_Buttons = {
        saveState: true,
        loadState: true,
        quickSave: true,
        quickLoad: true,
        saveSavFiles: true,
        loadSavFiles: true,
        gamepad: true,
        settings: true
      };
      // Every failure used to collapse into one opaque "could not load", which
      // made a blocked script indistinguishable from a bad ROM. Report why.
      function reportError(detail) {
        parent.postMessage({ type: 'arcade:emulator-error', detail: String(detail).slice(0, 300) }, location.origin);
      }
      addEventListener('error', (event) => reportError(event?.message || 'script error'));
      addEventListener('unhandledrejection', (event) => reportError(event?.reason?.message || event?.reason || 'promise rejection'));
      addEventListener('pagehide', () => parent.postMessage({ type: 'arcade:emulator-closed' }, location.origin));
    </script>
    <script>
      /**
       * The server sends Cross-Origin-Embedder-Policy: credentialless for the
       * PS2 core's SharedArrayBuffer workers, and that policy also governs this
       * page. Under COEP a cross-origin script is admitted two different ways:
       * a no-cors load whose response carries CORP, or a CORS load whose
       * response carries Access-Control-Allow-Origin.
       *
       * Which one the CDN supports cannot be assumed, and picking wrong turns a
       * working emulator into a blocked one, so both are tried: CORS first,
       * then a plain load, and only then is it reported as a failure.
       */
      function loadEmulatorRuntime(useCors) {
        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        if (useCors) script.crossOrigin = 'anonymous';
        script.onload = () => parent.postMessage({ type: 'arcade:emulator-ready' }, location.origin);
        script.onerror = () => {
          if (useCors) { loadEmulatorRuntime(false); return; }
          reportError('loader.js was blocked or unreachable with and without CORS (check COEP and the CDN)');
        };
        document.body.append(script);
      }
      loadEmulatorRuntime(true);
    </script>
  </body>
</html>
