name: Link ptcarcade.fun to Fly

# The one-time cutover: deploy, allocate addresses, repoint Cloudflare DNS,
# issue the certificate, verify. Manual trigger only — it changes live DNS, so
# it must never fire from a push.
#
# Requires two repository secrets:
#   FLY_API_TOKEN        fly tokens create deploy -x 8760h
#   CLOUDFLARE_API_TOKEN a token with Zone -> DNS -> Edit on this zone
#
# Safe to re-run: every step is idempotent, and a settled zone plans no changes.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain to point at this Fly app
        default: ptcarcade.fun
        required: true
      dry_run:
        description: Print the DNS changes without applying them
        type: boolean
        default: true

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy the current commit
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # An apex domain cannot use a CNAME, so it needs real addresses. A shared
      # IPv4 will not serve one, hence --yes on the dedicated allocation.
      - name: Allocate dedicated addresses
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          have_v4=$(flyctl ips list --json | jq -r '[.[] | select(.Type=="v4")] | length')
          have_v6=$(flyctl ips list --json | jq -r '[.[] | select(.Type=="v6")] | length')
          [ "$have_v4" -gt 0 ] || flyctl ips allocate-v4 --yes
          [ "$have_v6" -gt 0 ] || flyctl ips allocate-v6
          flyctl ips list

      - name: Read the app's addresses
        id: ips
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          ips=$(flyctl ips list --json)
          echo "ipv4=$(jq -r '[.[] | select(.Type=="v4") | .Address][0] // ""' <<<"$ips")" >> "$GITHUB_OUTPUT"
          echo "ipv6=$(jq -r '[.[] | select(.Type=="v6") | .Address][0] // ""' <<<"$ips")" >> "$GITHUB_OUTPUT"

      - name: Point Cloudflare DNS at Fly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node tools/link-domain.mjs \
            --domain "${{ inputs.domain }}" \
            --ipv4 "${{ steps.ips.outputs.ipv4 }}" \
            --ipv6 "${{ steps.ips.outputs.ipv6 }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Issue certificates
        if: ${{ !inputs.dry_run }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          # Already-added hostnames are not an error to re-add.
          flyctl certs add "${{ inputs.domain }}" || true
          flyctl certs add "www.${{ inputs.domain }}" || true
          # Validation waits on DNS propagation, so poll rather than assume.
          for attempt in $(seq 1 30); do
            if flyctl certs show "${{ inputs.domain }}" | grep -qi 'Certificate.*issued\|Configured.*true'; then
              echo "certificate issued"
              break
            fi
            echo "waiting for certificate ($attempt/30)"
            sleep 20
          done
          flyctl certs show "${{ inputs.domain }}"

      - name: Verify the live domain
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "--- resolves to ---"
          dig +short A "${{ inputs.domain }}"
          # A Cloudflare anycast address here means the record is still proxied,
          # or a Pages project still claims the hostname.
          if dig +short A "${{ inputs.domain }}" | grep -qE '^(104\.21\.|172\.67\.)'; then
            echo "::error::${{ inputs.domain }} still resolves to Cloudflare. Set the record to DNS only, and check Workers & Pages -> Custom domains."
            exit 1
          fi
          for attempt in $(seq 1 20); do
            if curl -fsS "https://${{ inputs.domain }}/health"; then
              echo
              echo "--- platform ---"
              curl -fsS "https://${{ inputs.domain }}/api/v1/platform" | head -c 400
              exit 0
            fi
            echo "waiting for the domain to answer ($attempt/20)"
            sleep 15
          done
          echo "::error::${{ inputs.domain }} did not answer /health"
          exit 1
